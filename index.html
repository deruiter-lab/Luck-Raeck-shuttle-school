<style>
/* Layout: één kolom app-scherm; niveaupad als route op de homepagina; sticky scorebalk; grote tikvlakken */
:root{
  --bg:#eef3fb; --surface:#ffffff; --fg:#122544; --muted:#5a6b88;
  --blue:#2b3bd8; --blue-soft:#dbe6f8; --orange:#f07f1a; --orange-soft:#fde8d4;
  --court:#2f7d5b; --court-line:#3f8cff; --good:#1f8a4c; --good-soft:#d9f2e3; --bad:#c23b2b; --bad-soft:#fbe1dd;
  --line:#cfdaec; --lock:#9aa8c0; --on-accent:#ffffff;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
 --picbg:transparent;
 --hw1:#c9d6ee; --hw2:#e7eef9; --hs:#a9b9d6; --hb:#b4c3df; --hf1:#3f9a6e; --hf2:#2b7552; --hl:1; --hlamp:0; --hban:.42; --hn:#1d1d55;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1730; --surface:#14244a; --fg:#eaf0fb; --muted:#9fb0cf;
  --blue:#9aa4ff; --blue-soft:#1e3463; --orange:#ff9a3d; --orange-soft:#4a2e14;
  --court:#256b4d; --court-line:#4a95ff; --good:#5fd08f; --good-soft:#173d2a; --bad:#ff7b6b; --bad-soft:#4a1f1a;
  --line:#2a3e6b; --lock:#5b6d93; --on-accent:#0c1730; --picbg:#e8eefb; color-scheme:dark; --hw1:#16233f; --hw2:#24365c; --hs:#33476f; --hb:#2c3e66; --hf1:#2c7a56; --hf2:#1c5238; --hl:.12; --hlamp:1; --hban:.38; --hn:#8fa3c8; }}
:root[data-theme="dark"]{
  --bg:#0c1730; --surface:#14244a; --fg:#eaf0fb; --muted:#9fb0cf;
  --blue:#9aa4ff; --blue-soft:#1e3463; --orange:#ff9a3d; --orange-soft:#4a2e14;
  --court:#256b4d; --court-line:#4a95ff; --good:#5fd08f; --good-soft:#173d2a; --bad:#ff7b6b; --bad-soft:#4a1f1a;
  --line:#2a3e6b; --lock:#5b6d93; --on-accent:#0c1730; --picbg:#e8eefb; color-scheme:dark; --hw1:#16233f; --hw2:#24365c; --hs:#33476f; --hb:#2c3e66; --hf1:#2c7a56; --hf2:#1c5238; --hl:.12; --hlamp:1; --hban:.38; --hn:#8fa3c8;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1d1d55}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1d1d55;color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;flex:1;min-width:0;background:none;border:0;color:#fff;text-align:left;padding:0}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
.pot{display:flex;align-items:center;gap:6px;background:#fff;color:#2b3bd8;border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pot svg{width:30px;height:30px}
.pot.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.iconbtn{background:rgba(255,255,255,.16);border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:#fff}
.iconbtn svg{width:22px;height:22px}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px} h2{font-size:23px} h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-family:var(--display);font-weight:600;font-size:18px;background:var(--blue);color:var(--on-accent);display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--blue-soft);color:var(--blue)}
.btn.go{background:var(--orange);color:#fff}
.btn svg{width:20px;height:20px}
.btn.small{padding:8px 14px;font-size:16px}
/* niveaupad */
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.path::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;width:4px;border-radius:4px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 18px)}
.stop{position:relative;display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 14px 14px 0;width:100%;margin-left:-34px}
.stop:hover:not(.locked){border-color:var(--blue)}
.stop .num{flex:none;width:68px;height:68px;margin-left:0;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;background:var(--blue);color:var(--on-accent);border:5px solid var(--bg);position:relative;left:-2px}
.stop.passed .num{background:var(--orange);color:#fff}
.stop.locked{opacity:.7}
.stop.locked .num{background:var(--lock);color:#fff}
.stop .num svg{width:28px;height:28px}
.stop .txt{min-width:0;flex:1}
.stop b{font-family:var(--display);font-size:20px;display:block}
.stop .sub{font-size:14px;color:var(--muted)}
.progress{height:8px;background:var(--blue-soft);border-radius:8px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--orange);border-radius:8px;transition:width .3s}
.medal{flex:none;width:40px;height:40px}
/* lijsten */
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.item:hover:not(:disabled){border-color:var(--blue)}
.item:disabled{opacity:.55}
.item .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-family:var(--display);font-weight:700;font-size:18px}
.item .ic svg{width:24px;height:24px}
.item.game .ic{background:var(--orange-soft);color:var(--orange)}
.item.exam{border-color:var(--orange)}
.item.exam .ic{background:var(--orange);color:#fff}
.item .t{flex:1;min-width:0}
.item .t b{font-family:var(--display);font-size:18px;display:block}
.item .t span{font-size:14px;color:var(--muted)}
.tag{font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag.ok{color:var(--good)} .tag.lock{color:var(--lock)}
.tag svg{width:18px;height:18px}
.games{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
/* les en vraag */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px}
.art{display:flex;justify-content:center;position:relative}
.art svg{max-width:100%;height:auto;touch-action:manipulation}
.say{font-size:21px;line-height:1.45}
.say strong{color:var(--blue)}
.speak{flex:none;border:0;background:var(--orange);color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.speak svg{width:26px;height:26px}
.speak.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--orange-soft)}}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--orange)}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;font-size:19px;font-family:var(--display);font-weight:600;text-align:left;min-height:58px}
.opts.two .opt,.opts.three .opt{text-align:center;font-size:21px}
.opts.three .opt{font-size:18px;padding:12px 6px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.blauw{border-color:#2b3bd8;color:#2b3bd8} .opt.oranje{border-color:#f07f1a;color:#c45f08}
:root[data-theme="dark"] .opt.blauw{color:#9cc0ff} :root[data-theme="dark"] .opt.oranje{color:#ffb06a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.blauw{color:#9cc0ff}:root:not([data-theme="light"]) .opt.oranje{color:#ffb06a}}
.fb{border-radius:16px;padding:14px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-family:var(--display)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--blue);font-family:var(--display);font-weight:600;font-size:17px;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.back svg{width:18px;height:18px}
.big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--blue);text-align:center;font-variant-numeric:tabular-nums}
.hint{font-family:var(--display);font-weight:600;color:var(--orange);text-align:center}
.timer{height:10px;border-radius:10px;background:var(--orange-soft);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left}
.board{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;background:#122544;color:#fff;border-radius:16px;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:24px;min-width:240px}
.board .sc{font-size:34px;font-variant-numeric:tabular-nums;text-align:right;color:#ffd08a}
.board .sv{width:26px;height:26px}
.koker{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.koker svg{width:26px;height:26px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px}
.badge.locked{opacity:.4}
.badge svg{width:16px;height:16px}
.profiles{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700}
.chip.on{border-color:var(--orange);background:var(--orange-soft)}
input[type=text],input[type=password],select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.fly{position:fixed;z-index:20;width:34px;height:34px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .8s}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--orange-soft);border-radius:14px;padding:12px;font-size:15px}
.hero{display:flex;gap:14px;align-items:center}
.hero svg{flex:none;width:72px;height:72px}
.miss{border-left:4px solid var(--bad);padding:8px 12px;background:var(--bad-soft);border-radius:0 12px 12px 0;font-size:16px}
.miss b{font-family:var(--display)}
.rule{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.rule svg{width:22px;height:22px;flex:none;color:var(--orange)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:26px}.say{font-size:19px}.big{font-size:46px}.board{font-size:20px;min-width:0;width:100%}}

/* ===== Eén scherm, geen scrollen: hoogte = venster, inhoud schaalt mee ===== */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.bar{position:relative;top:auto;flex:none;padding-block:8px}
.brand{font-size:20px}
.pot{font-size:18px;padding:3px 10px 3px 5px}.pot svg{width:26px;height:26px}
.iconbtn{width:38px;height:38px}
main{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;padding-block:12px;gap:10px}
main>*{flex:none}
h1{font-size:clamp(21px,3.4vh,28px)} h2{font-size:clamp(18px,2.8vh,22px)}
.small{font-size:14px}
.hero{gap:10px}.heroic{flex:none;width:48px;height:48px}.heroic svg{width:48px;height:48px}

.stage{position:relative}

.bigbtn{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;gap:0 12px;width:100%;text-align:left;border:0;border-radius:18px;background:var(--orange);color:#fff;padding:12px 16px;box-shadow:0 3px 0 #c45f08}

.bigbtn .bb2{grid-column:1;font-size:14px;opacity:.95}

.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 2px}
.tb.off{opacity:.5}.tbi{width:20px;height:20px;color:var(--blue)}.tbi svg{width:20px;height:20px}
.tbs{font-size:11px;letter-spacing:1px;color:var(--orange);line-height:1}
.tile.opf{border-color:var(--orange)}.tile.opf .tn{background:var(--orange);color:#fff}
.ltitle{display:flex;align-items:center;gap:8px}.tic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}.tic svg{width:20px;height:20px}
.opts.pics{grid-template-columns:1fr;gap:10px}
.opts.pics .opt{display:flex;flex-direction:row;align-items:center;gap:14px;text-align:left;font-size:19px;line-height:1.25;padding:10px 14px;min-height:64px}
.opic{flex:none;display:grid;place-items:center;width:clamp(40px,6.5vh,52px);height:clamp(40px,6.5vh,52px);color:var(--blue)}.opic svg{width:100%;height:100%}
.opt svg{vertical-align:-4px}
.tbl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.tr{display:grid;grid-template-columns:1.2fr 1fr 1fr .8fr;gap:6px;padding:6px 8px;border-top:1px solid var(--line)}
.tr.th{border-top:0;background:var(--blue-soft);font-weight:700}
.qrbox{flex:none;background:#fff;padding:6px;border-radius:8px;min-width:0}.qrbox:empty{display:none}
body.bigtext .say{font-size:clamp(18px,2.9vh,24px)} body.bigtext .opt{font-size:19px} body.bigtext .opts.four .opt{font-size:16px} body.bigtext .tile .tt{font-size:16px}

.splash{flex:1 1 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:clamp(10px,2vh,18px);text-align:center;padding-block:clamp(6px,2vh,24px)}
.logo{flex:none;width:min(78%,300px)}
.logo img{display:block;width:100%;height:auto;max-height:16vh;object-fit:contain}
:root[data-theme="dark"] .logo{background:#fff;border-radius:16px;padding:10px 14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:#fff;border-radius:16px;padding:10px 14px}}
.hero-card{flex:none;position:relative;width:100%;max-width:420px;border-radius:26px;overflow:hidden;padding:clamp(10px,2vh,18px) 16px clamp(16px,3vh,26px);
  background:radial-gradient(120% 90% at 50% 0%,#3a48e0 0%,#2b3bd8 35%,#1d1d55 100%);color:#fff;box-shadow:0 10px 30px rgba(29,29,85,.28)}
.hero-svg{display:block;width:100%;height:auto;max-height:18vh}
.hero-card h1{color:#fff;font-size:clamp(34px,6.4vh,50px);letter-spacing:.3px;margin-top:-4px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.hero-card .tag{margin:4px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(16px,2.6vh,21px);color:#ffb06a}
.spsteps{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px}
.st{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 4px}
.sti{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange);margin-bottom:2px}.sti svg{width:20px;height:20px}
.st b{font-family:var(--display);font-size:16px}.st small{font-size:12px;color:var(--muted);line-height:1.2}
.spbot{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:420px}
.bigbtn.start{grid-template-rows:auto;padding:14px 20px}.bigbtn.start .bb1{font-size:26px}.bigbtn.start svg{grid-row:1}
.pulse{animation:pulse2 2.2s ease-in-out infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.sprow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.sprow label{display:inline-flex;align-items:center;gap:6px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:4px}
.linkbtn svg{width:18px;height:18px}
.copy{margin:0;font-size:11px;letter-spacing:1px;color:var(--muted)}
body.onsplash .bar{display:none}


/* route: blokken even breed, verbindingen tussen de niveaus */
.path{display:flex;flex-direction:column;gap:0;padding-left:0}
.path::before{display:none}
.stop{margin-left:0;width:100%;padding:8px 12px;gap:12px;border-radius:16px}
.stop .num{width:46px;height:46px;font-size:22px;border:0;left:0}
.conn{height:24px;width:46px;margin-left:12px;display:grid;place-items:center}
.conn svg{width:22px;height:24px;stroke:var(--lock)}
.conn.lit svg{stroke:var(--orange)}
.namerow{display:flex;align-items:center;gap:8px;min-width:0}
.namerow h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namerow input{flex:1;min-width:0;font-family:var(--display);font-size:20px;font-weight:700;padding:6px 10px}
.editbtn{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--blue);display:grid;place-items:center;padding:0}
.editbtn svg{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* stappenbalk op het niveauscherm */
.stepbar{display:flex;align-items:center;width:100%;padding:2px 0}
.sb-dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.sb-dot svg{width:14px;height:14px}
.sb-dot .sbm{width:20px;height:20px}
.sb-dot.done{background:var(--orange);border-color:var(--orange);color:#fff}
.sb-dot.now{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.sb-line{flex:1;height:3px;min-width:4px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.sb-line.lit{background:var(--orange)}
.tile.now{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.catch{flex:none;max-width:24ch;margin:0;font-family:var(--display);font-weight:600;font-size:clamp(19px,3vh,24px);line-height:1.3;color:var(--fg);text-wrap:balance}
.catch strong{color:var(--orange)}

/* plaatjes bovenaan in het witte blok, met herhaalknop */
.stage .art{flex:0 1 auto;align-items:flex-start;justify-content:center;position:relative}
.stage .art>svg{width:auto;height:auto;max-width:100%;max-height:44vh}
.lesson-stage .art>svg{max-height:48vh}
.replay{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--blue);display:grid;place-items:center;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:2}
.replay svg{width:18px;height:18px}
.endonly{transition:opacity .25s}
/* dikke pijlen tussen de niveaus */
:root{--arrow:#c7cfe2;--arrow-lit:#ffc48e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--arrow:#3a4c78;--arrow-lit:#b8723a}}
:root[data-theme="dark"]{--arrow:#3a4c78;--arrow-lit:#b8723a}
.conn{height:30px;width:100%;margin:2px 0;display:grid;place-items:center}
.conn svg{width:40px;height:28px;fill:var(--arrow);stroke:none}
.conn.lit svg{fill:var(--arrow-lit)}
.stage .art>div[style*="width:110px"]{width:110px!important;height:110px!important;max-height:none}

.fb{flex-wrap:wrap;font-size:clamp(15px,2.35vh,20px);line-height:1.4;gap:8px 10px}
.fb .fbt{flex:1 1 calc(100% - 40px)}
.fb .btn{margin-left:auto}
body.bigtext .fb{font-size:clamp(18px,2.9vh,24px)}
.conn{height:26px}
.conn svg{width:36px;height:22px;stroke:var(--arrow);stroke-width:4}
.conn.lit svg{stroke:var(--arrow-lit)}
.namerow input{height:44px;box-sizing:border-box}
.okbtn{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;padding:0}
.hero .okbtn svg,.hero .editbtn svg{flex:none}
.hero .okbtn svg{width:20px;height:20px}
.hero .editbtn svg{width:16px;height:16px}
.okbtn{overflow:hidden}
.spname{display:flex;align-items:center;gap:10px;width:100%}
.spname label{flex:none;font-family:var(--display);font-weight:700;font-size:17px}
.spname input{flex:1;min-width:0;height:44px;box-sizing:border-box;font-family:var(--display);font-weight:600;font-size:18px}

/* 2. rustiger kleur: voortgang in blauw, oranje voor de belangrijkste knop en beloningen */
.progress i{background:var(--blue)}
.dots i.on{background:var(--blue)}
.stop.passed .num{background:var(--orange)}
/* 6. grotere tikvlakken */
.back{min-height:48px;padding:4px 8px 4px 0}
.speak{width:48px;height:48px}
.hintbtn{width:48px;height:48px}
.replay{width:44px;height:44px}
.editbtn{width:40px;height:40px}
.tab{min-height:44px}
.chip{min-height:44px}
/* 4. zachte overgang */
#app.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 3. feest */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-50px;width:30px;height:30px;animation:fall linear forwards}
.confetti span svg{width:100%;height:100%}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
.resic.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
/* 7. bevestiging */
.confirm{position:fixed;inset:0;z-index:40;background:rgba(18,37,68,.55);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.confirm-box{background:var(--surface);color:var(--fg);border-radius:22px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* 8. voortgangsbolletjes */
.qdots{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.qdots i{flex:1 1 0;min-width:10px;max-width:40px;height:10px;border-radius:6px;background:var(--line)}
.qdots i.cur{background:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.qdots i.ok{background:var(--good)}
.qdots i.no{background:var(--bad)}
/* 9. meelezen */
.snt{border-radius:6px;transition:background .15s,box-shadow .15s}
.snt.reading{background:none;box-shadow:none}
/* 5. donkere modus: logo en lichte vlakken */
:root[data-theme="dark"] .hero-card{box-shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-card{box-shadow:none}}
@media (prefers-reduced-motion:reduce){#app.enter,.resic.pop{animation:none}}
.tiles>.tile:last-child:nth-child(odd){grid-column:2}
.opts.pics .opt .onum{display:block;width:100%;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(30px,5vh,44px);color:var(--blue);line-height:1.1}

/* plaatjes: lichte ondergrond in donkere modus */
.opic,.art>div[style*="width:110px"]{background:var(--picbg);border-radius:14px}
.opic{padding:3px;box-sizing:border-box}
/* vragen met plaatjes vullen het scherm */
.stage.noart .opts.pics{flex:1 1 auto;min-height:0;grid-auto-rows:minmax(0,1fr);max-height:560px}
.stage.noart .opts.pics .opt{min-height:0;overflow:hidden;font-size:clamp(18px,2.7vh,23px)}
.stage.noart .opts.pics .opic{width:clamp(52px,10vh,92px);height:clamp(52px,10vh,92px)}
.stage.noart.answered .opts.pics .opic{width:clamp(40px,6.5vh,64px);height:clamp(40px,6.5vh,64px)}
/* kleur per onderwerp */
.tile[style*="--tc"]:not(.done) .tn,.tb[style*="--tc"] .tbi,.tic[style*="--tc"]{color:var(--tc)}
.tile[style*="--tc"]:not(.done) .tn,.tic[style*="--tc"]{background:var(--blue-soft);background:color-mix(in srgb,var(--tc) 15%,var(--surface))}
.tb[style*="--tc"]{border-color:color-mix(in srgb,var(--tc) 35%,var(--line))}
.tile.now[style*="--tc"]{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 22%,transparent)}
/* shuttleteller licht op */
.pot.bump{animation:bump .5s,potglow 1s}
@keyframes potglow{0%{box-shadow:0 0 0 0 rgba(255,196,64,0)}25%{box-shadow:0 0 0 5px rgba(255,196,64,.7),0 0 22px 8px rgba(255,196,64,.65)}100%{box-shadow:0 0 0 0 rgba(255,196,64,0)}}

/* 1: dichte lessen tonen hun onderwerp */
.tile:disabled{opacity:1}.tile:disabled .tt{opacity:.55}.tile:disabled .tn>svg{opacity:.5}
.tile .tn{position:relative}
.tn .lk{position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--muted);display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--line)}
.tile .tn .lk svg{width:11px;height:11px}
/* 2: melding */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 124px);transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;background:var(--orange);color:#fff;font-family:var(--display);font-weight:700;font-size:20px;padding:8px 20px 8px 10px;border-radius:999px;box-shadow:0 8px 24px rgba(10,20,60,.25);white-space:nowrap;animation:toastin .4s cubic-bezier(.3,1.5,.6,1);transition:opacity .4s,transform .4s;pointer-events:none}
.toast svg{width:30px;height:30px;background:#fff;border-radius:50%;padding:3px;box-sizing:border-box}
.toast small{font-size:15px;opacity:.9}
.toast.plain{padding:10px 18px;font-size:16px;white-space:normal;max-width:min(88vw,360px);text-align:center;background:var(--fg);color:var(--bg)}
.toast.out{opacity:0;transform:translateX(-50%) translateY(-12px)}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.85)}}
/* 3: instellingen */
.vdet{border-top:1px solid var(--line);padding-top:12px}
.vdet>summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:17px;color:var(--blue);list-style-position:inside}
.vdet>.stack{margin-top:10px}
.sethead{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
/* 4: figuurtje per speler */
.hav{flex:none;width:34px;height:34px;display:grid;place-items:center}.hav svg{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.heroav{flex:none;width:56px;height:56px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}.heroav svg{width:56px;height:56px}
.avpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.avpick button{width:44px;height:44px;padding:0;border:3px solid transparent;border-radius:50%;background:none;cursor:pointer}
.avpick button.on{border-color:var(--fg)}
.avpick button svg{width:100%;height:100%}
.avpick button{position:relative}
.avb.avlock>svg{filter:grayscale(1) brightness(1.15) opacity(.5)}
.avlk{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#1d1d55;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.avlk svg{width:11px;height:11px}
.toast .tav{flex:none;display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:6px}.toast .tav svg{width:34px;height:34px;border-radius:50%;padding:0;background:none}.toast .tav{width:34px;height:34px}.toast.plain{width:max-content}
.chip .cav{display:inline-block;width:22px;height:22px;vertical-align:-6px;margin-right:6px}.chip .cav svg{width:22px;height:22px}
.stop .me{position:absolute;right:-10px;top:-10px;width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 3px var(--bg);animation:mebob 2.4s ease-in-out infinite}
.stop .me svg{width:30px;height:30px;display:block}
@keyframes mebob{50%{transform:translateY(-3px)}}
/* 5: vriendelijk fout */
.opt.wrong{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.opt.wrong,.stop .me,.toast{animation:none}}

.avphoto{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;margin-top:4px}
.avphoto .btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.avphoto .btn svg{width:18px;height:18px}
.avphoto input:focus-visible+.btn,.avphoto .btn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
#avmsg:empty{display:none}

/* compacter openingsscherm: alles op één scherm */
.splash{gap:clamp(8px,1.6vh,16px);padding-block:clamp(6px,1.5vh,20px)}
.logo img{max-height:min(12vh,110px)}
.hero-card{padding:clamp(6px,1.2vh,12px) 14px clamp(10px,1.6vh,16px);border-radius:22px}
.hero-svg{max-height:min(12.5vh,110px)}
.hero-card h1{font-size:clamp(28px,min(5vh,10.5vw),44px);white-space:nowrap;line-height:1.05;margin-top:-2px}
.hero-card .tag{font-size:clamp(14px,2.2vh,19px);margin-top:2px}
.catch{font-size:clamp(16px,2.4vh,22px);line-height:1.25}

/* openingsscherm in de stijl van het linkvoorbeeld */
body.onsplash{background:#1d1d55 radial-gradient(130% 85% at 30% 18%,#3a48e0 0%,#2b3bd8 42%,#1d1d55 100%) no-repeat fixed}

.splash2{position:relative;flex:1 1 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:clamp(10px,2vh,20px);text-align:center;padding-block:clamp(14px,4.5vh,44px) clamp(6px,1.5vh,16px);color:#fff}
.sp-bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.splash2>*:not(.sp-bg){position:relative;z-index:1}
.sp-lock{width:min(84%,380px);display:flex;flex-direction:column;align-items:center}
.sp-lock svg{display:block;width:100%;height:auto;max-height:30vh}
.sp-tag{margin:clamp(6px,1.4vh,14px) 0 0;font-family:var(--display);font-weight:600;font-size:clamp(15px,min(2.6vh,5.2vw),21px);white-space:nowrap;color:#fff}
.sp-catch{max-width:25ch;margin:0;font-family:var(--display);font-weight:500;font-size:clamp(16px,2.4vh,21px);line-height:1.3;color:#dbe2ff;text-wrap:balance}
.sp-catch strong{color:#ffb06a;font-weight:600}
.splash2 .spname label{color:#fff}
.splash2 .spname input{background:#fff;color:#1d1d55;border-color:#fff}
.splash2 .spname input::placeholder{color:#7a84a8}
.splash2 .sprow,.splash2 .sprow label,.splash2 .linkbtn{color:#e6eaff}
.splash2 .copy{color:#aab4e8}
@media (prefers-reduced-motion: reduce){.sp-fly{display:none}}

.sp-lock svg{max-height:36vh}
.sp-catch{max-width:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(15px,min(2.4vh,4.7vw),21px)}
.sp-catch>*{white-space:nowrap}

.splash2 .spname{flex-direction:column;align-items:center;gap:6px}
.splash2 .spname label{font-size:clamp(17px,2.6vh,20px)}
.splash2 .spname input{flex:none;width:min(100%,300px);text-align:center}
.splash2>.spname{position:relative;z-index:1;width:100%;max-width:420px}

/* testmodus */
.tpill{display:none;margin-left:8px;vertical-align:1px;line-height:1.3;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:1.5px;padding:2px 7px;border-radius:999px;background:#f07f1a;color:#fff}
body.testmode .tpill{display:inline-block}
.testbox{border:2px dashed var(--orange);border-radius:14px;padding:10px 12px}
.testbox label{align-items:flex-start;flex-wrap:nowrap;gap:8px}.testbox label>span{flex:1;min-width:0}
.jump details{border-top:1px solid var(--line);padding:6px 0}
.jump summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--blue)}
.jl{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.jr{display:flex;align-items:center;gap:6px}.jr>span{flex:1;min-width:0;font-size:14px}
.topline #tskip{margin-left:auto;margin-right:8px;white-space:nowrap;padding:6px 10px;font-size:14px;flex:none}.topline #tskip svg{width:14px;height:14px}

.revbar{height:6px;border-radius:6px;background:var(--blue-soft);overflow:hidden;flex:none}.revbar i{display:block;height:100%;background:var(--orange)}

  if(!S.current||!S.profiles[S.current]){ S.profiles['Speler']=S.profiles['Speler']||newProfile(); S.current='Speler'; }

}

 for(const f of F){const D=f.durs.reduce((a,b)=>a+b,0); if(e>=f.t&&e<f.t+D) return prFl(f,e-f.t);}
 if(F.length&&e<F[0].t){
  if(pl.hold){const C=F[0].segs[0],H=prHand(pl,pl.hold,e);
   const k=Math.max(0,Math.min(1,(e-(F[0].t-230))/230)); return {x:H[0]+(C[0]-H[0])*k*k,y:H[1]+(C[1]-H[1])*k*k,a:180,v:1};}
  if(F[0].pre) return {x:F[0].segs[0][0],y:F[0].segs[0][1],a:F[0].preA||0,v:1};
  return {v:0};}
 if(!F.length){ if(pl.spec.holdStatic){const H=prHand(pl,pl.spec.holdStatic,e); return {x:H[0],y:H[1],a:180,v:1};} return {v:0};}
 let last=F[0]; F.forEach(f=>{if(f.t>=last.t) last=f;}); return prFl(last,1e9);
}
function prFl(f,el){
 let si=0; while(si<f.segs.length-1&&el>f.durs[si]){el-=f.durs[si];si++;}
 const q=f.segs[si], t0=Math.min(1,el/f.durs[si]), t=f.lin?t0:(si===0?prDrag(t0):t0*t0*(1.6-0.6*t0));
 const [x,y]=prQ(q,t);
 const dx=2*(1-t)*(q[2]-q[0])+2*t*(q[4]-q[2]), dy=2*(1-t)*(q[3]-q[1])+2*t*(q[5]-q[3]);
 let a=f.fixA!=null?f.fixA:Math.atan2(dy,dx)/prRad-90;
 if(f.spin) a=(1-Math.pow(1-Math.min(1,(el+(si?f.durs[0]:0))/f.durs.reduce((p,c)=>p+c,0)),2))*f.spin;
 if(f.endAng!=null&&si===f.segs.length-1&&t0>.86&&f.fixA==null&&!f.spin){let d=((f.endAng-a+540)%360)-180; a=a+d*((t0-.86)/.14);}
 return {x,y,a,v:1};}

function prState(pl,e){
 const ee=pl.caught?Math.min(e,pl.END):e, arms={};
 for(const id in pl.P){const [A,f]=prArm(pl.K[id],ee); const B=Object.assign({},prBody(pl.BK[id],ee)); const L=pl.legs[id]; if(L){const k=Math.max(0,Math.min(1,(e-L[0])/(L[1]-L[0])));B.lu+=L[2]*PR_EASE.io(k);} arms[id]=[A[0],A[1],f,B];}
 return {arms,sh:prShuttle(pl,ee)};}

/* Wedstrijd-simulatie: het einde van één game, rally voor rally */
function simGame(sys){
  const N=['Tim','Fleur']; const st={Tim:0,Fleur:0}; let sv=pick(N);
  if(sys===21){st.Tim=Math.floor(rnd(17,19.99));st.Fleur=st.Tim+pick([-2,-1,0,1]);}else{st.Tim=Math.floor(rnd(11,13.99));st.Fleur=st.Tim+pick([-1,0,1]);}
  const qs=[]; const other=p=>N[1-N.indexOf(p)];
  const FAULTS=[p=>`${p} slaat de shuttle in het net.`,p=>`${p} slaat de shuttle achter de achterste lijn, uit.`,p=>`${p} raakt met het racket het net.`,p=>`De shuttle raakt het lichaam van ${p}.`];
  const WINS=[p=>`${p} slaat de shuttle binnen de lijnen op de grond bij ${other(p)}.`,p=>`${p} wint de rally met een smash.`];
  for(let i=0;i<20&&!over(st.Tim,st.Fleur,sys);i++){
    const r=Math.random(); let ev,win=null;
    if(r<.08){ev='Er rolt een shuttle van de buurbaan op de baan.';}
    else if(r<.4){const f=pick(N);ev=pick(FAULTS)(f);win=other(f);}
    else {win=pick(N);ev=pick(WINS)(win);}
    const before=Object.assign({},st), svB=sv, ot=other(sv);
    let correct,why;
    const fmt=(p,s)=>`${p} serveert van ${boxWord(par(s[p]))} · ${s[p]} – ${s[other(p)]}`;
    if(!win){correct=`${sv} serveert opnieuw van ${boxWord(par(st[sv]))} · ${st[sv]} – ${st[ot]}`; why='Let: niemand krijgt een punt, en dezelfde speler serveert opnieuw vanuit hetzelfde vak.';}
    else{st[win]++; const done=over(st[win],st[other(win)],sys); sv=win;
      correct=done?`${win} wint de game · ${st[win]} – ${st[other(win)]}`:fmt(win,st);
      why=`${win} wint de rally${win!==svB?' en mag nu serveren':' en serveert opnieuw'}. ${done?'Dat is genoeg voor de game!':`${st[win]} is ${st[win]%2===0?'even: van rechts':'oneven: van links'}.`}`;}
    const dis=[];
    if(win){const lo=other(win);
      dis.push(`${win} serveert van ${boxWord(par(st[win]+1))} · ${st[win]} – ${st[lo]}`);
      dis.push(`${lo} serveert van ${boxWord(par(st[lo]))} · ${st[lo]} – ${st[win]}`);
      dis.push(`${svB} serveert opnieuw van ${boxWord(par(before[svB]))} · ${before[svB]} – ${before[other(svB)]}`);
      dis.push(over(st[win],st[lo],sys)?fmt(win,st):`${win} wint de game · ${st[win]} – ${st[lo]}`);
    } else {
      dis.push(`${svB} serveert van ${boxWord(par(before[svB]))} · ${before[svB]+1} – ${before[ot]}`);
      dis.push(`${ot} serveert van ${boxWord(par(before[ot]+1))} · ${before[ot]+1} – ${before[svB]}`);
      dis.push(`${svB} serveert opnieuw van ${boxWord(par(before[svB]+1))} · ${before[svB]} – ${before[ot]}`);
    }
    const q={t:'mc',sim:true,sys,q:`${sys===15?'Telling tot 15. ':''}${ev} Wat roep jij als scheidsrechter?`,art:{board:[[svB,before[svB],1],[ot,before[ot],0]]},why,pre:'Rally '+(i+1)};
    const ds=[...new Set(dis)].filter(d=>d!==correct).slice(0,3);
    q.opts=[correct].concat(ds); q.a=0;
    qs.push(q);
  }
  return qs;
}

const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))*100)/100;
const par=n=>n%2===0?'R':'L';
const boxWord=b=>b==='R'?'rechts':'links';
function near(x,y,A){const d=.42;return [Math.abs(x-A.x0),Math.abs(x-A.x1),Math.abs(y-A.y0),Math.abs(y-A.y1)].some(v=>v<d)&&x>A.x0-d&&x<A.x1+d&&y>A.y0-d&&y<A.y1+d;}
function withOpts(q,correct,distract){
  const ds=[...new Set(distract)].filter(d=>d!==correct); const opts=shuffle([correct].concat(shuffle(ds).slice(0,3)));
  q.opts=opts;q.a=opts.indexOf(correct);return q;
}

function over(a,b,sys){const m=Math.max(a,b),d=Math.abs(a-b);if(sys===11)return m>=11;if(sys===15)return (m>=15&&d>=2)||m>=21;return (m>=21&&d>=2)||m>=30;}
function prepScore(q){
  const sys=q.sys, N=['Tim','Fleur'];

    else{const top=sys===15?[13,20]:[19,29];if(Math.random()<.6){a=Math.floor(rnd(top[0],top[1]));b=a+pick([-2,-1,0,0,1]);}else{a=Math.floor(Math.random()*sys);b=Math.floor(Math.random()*sys);}}
    if(b<0)b=0;

  const dis=[];
  const flip=Object.assign({},ns); dis.push(`${win} serveert van ${boxWord(par(ns[win]+1))} · ${ns[win]} – ${ns[lo]}`);
  dis.push(`${lo} serveert van ${boxWord(par(ns[lo]))} · ${ns[lo]} – ${ns[win]}`);

function prepDub(q){

function nextStep(){
  for(const l of LEVELS){ if(!levelOpen(l.n)) return null; if(P().passed[l.n]) continue;
    if(opfrisNeeded(l.n)) return {kind:'opfris',n:l.n,label:`Opfrissen voor niveau ${l.n}`};

/* leerpad: een kronkelend pad over een badmintonveld, met een ster bij elke gehaalde les */
function routeView(l,n,eo,pass){
  const p=P(), items=l.lessons.map((x,i)=>({i,x,open:lessonOpen(l,i),done:!!p.lessons[x.id]})); items.push({exam:true,open:eo,done:pass});
  const nowI=items.findIndex(it=>it.open&&!it.done);
  const cols=4, RH=(window.innerHeight&&window.innerHeight<720)?76:84, rows=Math.ceil(items.length/cols), H=rows*RH+18;
  const pos=items.map((_,k)=>{const r=Math.floor(k/cols),c=k%cols,cc=r%2?cols-1-c:c;return [(cc+.5)/cols*100,42+r*RH];});
  let segs='';
  for(let k=0;k<pos.length-1;k++){const [x1,y1]=pos[k],[x2,y2]=pos[k+1];
    const d=y1===y2?`M${x1} ${y1} L${x2} ${y2}`:(()=>{const side=x1>50?1:-1;return `M${x1} ${y1} C${x1+side*16} ${y1} ${x2+side*16} ${y2} ${x2} ${y2}`;})();
    segs+=`<path d="${d}" class="${items[k].done?'lit':''}" vector-effect="non-scaling-stroke"/>`;}
  const tc=t=>{const m=tcol(t).match(/--tc:([^"]+)/);return m?m[1]:'#2b3bd8';};
  return `<div class="route" style="height:${H}px" aria-label="Jouw route door niveau ${n}">
    <svg class="rcourt" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0V${H}M4 0V${H}M96 0V${H}M0 ${H*.5}H100" vector-effect="non-scaling-stroke"/></svg>
    <svg class="rpath" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">${segs}</svg>
    ${items.map((it,k)=>{const [x,y]=pos[k], st=it.done?'done':k===nowI?'now':it.open?'':'lock';
      const lab=it.exam?'Eindtoets':`${it.i+1}. ${it.x.title}`;
      const ico=it.exam?(it.done?I.medal:it.open?ic('medal',26):I.lock):(it.done?I.check:it.open?I[TOPICS[it.x.topic].icon]:I.lock);
      return `<button class="rn ${st} ${it.exam?'rn-ex':''}" ${it.exam?'id="exam"':`data-l="${it.i}"`} style="left:${x}%;top:${y}px;--tc:${it.exam?'#f0a81a':tc(it.x.topic)}" ${it.open?'':'disabled'} aria-label="${esc(lab)}${it.done?', gehaald':it.open?'':', op slot'}">
        <span class="rn-c">${ico}${it.done?'<span class="rn-st">★</span>':''}${k===nowI?`<span class="rn-me">${avatarFor(S.current)}</span>`:''}</span><span class="rn-t">${esc(lab)}</span></button>`;}).join('')}
  </div>`;
}
function stepBar(l){
  const p=P(); const of=opfrisNeeded(l.n); let cur=-1;
  const steps=l.lessons.map((x,i)=>{const done=!!p.lessons[x.id], open=lessonOpen(l,i); if(open&&!done&&cur<0) cur=i; return {done,open,i};});
  const exDone=!!p.passed[l.n], exOpen=examOpen(l)&&!exDone; if(exOpen&&cur<0) cur=steps.length;
  const dot=(st,label,inner)=>`<span class="sb-dot ${st}" title="${label}">${inner}</span>`;
  let h='<div class="stepbar" aria-label="Volgorde van de lessen">';
  steps.forEach((st,i)=>{ if(i) h+=`<span class="sb-line ${steps[i-1].done?'lit':''}"></span>`;
    h+=dot(st.done?'done':i===cur?'now':'',`Les ${i+1}`,st.done?I.check:`${i+1}`); });
  h+=`<span class="sb-line ${steps.every(x=>x.done)?'lit':''}"></span>`+dot(exDone?'done':exOpen?'now':'','Eindtoets',I.medal.replace('<svg','<svg class="sbm"'));
  return h+'</div>'+(of?'<p class="note" style="margin:0">Eerst even opfrissen, dan gaat les 1 open.</p>':'');
}
function revList(){const r=[];LEVELS.forEach(l=>l.lessons.forEach((le,li)=>le.slides.forEach((_,i)=>r.push([l.n,li,i]))));return r;}
function revGo(g,dir){const r=revList();g=Math.max(0,Math.min(r.length-1,g));const [n,li,i]=r[g];S.revpos=g;save();go({view:'lesson',n,li,i,review:true},dir);}
if(document.addEventListener) document.addEventListener('keydown',e=>{if(!(cur&&cur.view==='lesson'&&cur.review))return;const r=revList();const g=r.findIndex(x=>x[0]===cur.n&&x[1]===cur.li&&x[2]===cur.i);if(e.key==='ArrowRight'&&g<r.length-1){e.preventDefault();revGo(g+1);}if(e.key==='ArrowLeft'&&g>0){e.preventDefault();revGo(g-1);}});
/* Lucky in de uitleg: juicht bij "in!" of een punt, schrikt bij een fout, denkt mee bij de rest */
function slideMood(t){t=t.replace(/<[^>]+>/g,'').toLowerCase();
  if(/\bfout\b|verboden|niet eerlijk|mag niet|uit\b/.test(t)) return 'oops';
  if(/\bin!|punt|gewonnen|goed gespeeld|high-five|kampioen|juich/.test(t)) return 'cheer';
  if(/\?|tip|let op|onthoud/.test(t)) return 'hint';
  return 'happy';}

function startQuiz(o){
  const qs=o.src().map(q0=>{const q=prep(q0);q.raw=q0;return q;});
  if(!qs.length){go({view:'home'});return;}
  go({view:'quiz',n:o.n,title:o.title,kind:o.kind,li:o.li,gid:o.gid,src:o.src,qs,k:0,good:0,streak:0,earned:0,answered:null,missed:[]});
}
function questionText(q){return (q.pre?q.pre+': ':'')+q.q;}

function svgPoint(svg,e){

  return [p.x/s+(+svg.dataset.xmin), p.y/s+(+svg.dataset.ymin)];
}

    const ang=(q,t)=>{const dx=2*(1-t)*(q[2]-q[0])+2*t*(q[4]-q[2]), dy=2*(1-t)*(q[3]-q[1])+2*t*(q[5]-q[3]); return Math.atan2(dy,dx)*180/Math.PI-90;};

  else msg=c.good===c.tot?'Alles goed! Super gespeeld.':c.good>=c.tot/2?'Goed gespeeld! Nog een potje?':'Goed geprobeerd. Nog een keer?';
  const l=LEVELS[c.n-1];
  const prim=c.kind==='exam'&&c.perfect&&c.n<5?['tonext',`Naar niveau ${c.n+1}`]
    :c.kind==='exam'&&c.perfect?['home','Naar alle niveaus']

    ${c.earned?`<p class="earnchip">${I.shuttle}<span>+<b class="cnt" data-n="${c.earned}">0</b> shuttles${c.bonus?` <small>(${c.bonus} bonus)</small>`:''}</span></p>`:''}
  </div>
  <div class="navcol resnav">
    <button class="btn go" id="${prim[0]}">${prim[1]} ${I.next}</button>
    <div class="resalt">
      ${c.kind==='exam'&&c.perfect?`<button class="btn alt small" id="dipl">${ic('medal',18)} Je diploma</button>`:''}
      ${c.missed.length?`<button class="btn alt small" id="review">Wat ging er mis? (${c.missed.length})</button>`:''}
      ${graded&&!c.perfect&&c.kind==='lesson'?`<button class="btn alt small" id="uitleg">Uitleg nog eens</button>`:''}
      ${c.kind!=='bak'?`<button class="btn alt small" id="lv">Niveau ${c.n}</button>`:''}
    </div>
  </div>`;
  const rtxt=msg+' Je hebt '+c.earned+' shuttles verdiend.'; const rsp=document.getElementById('rsp'); if(rsp) rsp.onclick=()=>speak(rtxt,rsp);
  if(S.auto) speak(rtxt,rsp);
  if((c.perfect&&graded)||(!graded&&c.tot&&c.good===c.tot)) celebrate();
  /* shuttles één voor één optellen */
  const cnt=app.querySelector('.earnchip .cnt'); if(cnt){const N=+cnt.dataset.n, rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(rm) cnt.textContent=N; else {let k=0; const step=Math.max(60,Math.min(160,1400/N)); setTimeout(function tick(){ if(!cnt.isConnected) return; k++; cnt.textContent=k; if(k<=12) try{kaching(.25);}catch(e){} if(k<N) setTimeout(tick,step);},900);}}
  const on=(id,fn)=>{const e=document.getElementById(id); if(e) e.onclick=fn;};
  on('lv',()=>go({view:'level',n:c.n,tab:c.kind==='game'?'spel':'les'}));
  on('again',()=>startQuiz({n:c.n,title:c.title,kind:c.kind,li:c.li,gid:c.gid,src:c.src}));
  on('home',()=>go({view:'home'}));

  on('nextles',()=>go({view:'lesson',n:c.n,li:c.li+1,i:0}));
  on('firstles',()=>go({view:'lesson',n:c.n,li:0,i:0}));
  on('toexam',()=>startQuiz({n:c.n,title:`Eindtoets niveau ${c.n}`,kind:'exam',src:()=>examFor(c.n)}));
  on('tonext',()=>go({view:'level',n:c.n+1,tab:'les'}));
  on('dipl',()=>{hush();cur={view:'diploma',n:c.n,back:c};render();});
  on('review',()=>{hush();cur=Object.assign({},c,{view:'review',ri:0,back:c});render();});
  { const pp=P(); pp.unl=pp.unl||[]; const nw=AVS.map((x,i)=>i).filter(i=>AVS[i].ok&&avOpen(i,pp)&&!pp.unl.includes(i));
    if(nw.length){ nw.forEach(i=>pp.unl.push(i)); save(); setTimeout(()=>{toast(`<span class="tav">${avatar(nw[0])}</span> <span>Nieuw plaatje verdiend: <b>${AVS[nw[0]].n}</b>! Kies het bij je naam.</span>`,true); kaching(.7);},900);} }
}

/* Bestand bewaren: in Claude via de downloads-functie, daarbuiten met een gewone download */
async function getSaver(){
  let dl=null; try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);}catch(e){}
  if(dl) return (name,blob)=>dl.save({filename:name,data:blob});
  if(window.claude) return null;
  return (name,blob)=>new Promise(res=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();res();},500);});
}

function svgToPng(svg,w,h){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cv.toBlob(b=>b?res(b):rej({code:'bad'}),'image/png');};
  img.onerror=()=>rej({code:'bad'}); img.src=url;});}

  const hb=document.getElementById('hear'); if(hb) hb.onclick=()=>speak('Hoi! Zal ik jou de spelregels van badminton uitleggen? De lijn is in!',hb,opts[+vs.value]);
  const rs=document.getElementById('rescan'); if(rs) rs.onclick=()=>{if(synth){try{synth.cancel();speak(' ');synth.getVoices();}catch(e){}} setTimeout(render,600); setTimeout(render,1800);};
  const rt=document.getElementById('rt'); if(rt) rt.oninput=()=>{S.rate=+rt.value;document.getElementById('rtv').textContent=S.rate.toFixed(2);save();};
  const au=document.getElementById('au'); if(au) au.onchange=e=>{S.auto=e.target.checked;save();};
  const vd=document.getElementById('vdet'); if(vd) vd.ontoggle=()=>{S.vopen=vd.open;save();};
  const av=document.getElementById('allv'); if(av) av.onchange=e=>{S.allv=e.target.checked;save();render();};
  const sps=document.getElementById('sps'); if(sps) sps.onchange=e=>{S.nosplash=!e.target.checked;save();};
  const snd=document.getElementById('snd'); if(snd) snd.onchange=e=>{S.nosound=!e.target.checked;save();if(!S.nosound)kaching();};
  const spv=document.getElementById('spv'); if(spv) spv.onclick=()=>go({view:'splash',from:'settings'});
  const bg=document.getElementById('bg'); if(bg) bg.onchange=e=>{S.big=e.target.checked;save();render();};
  const tm=document.getElementById('tm'); if(tm) tm.onchange=e=>{S.testmode=e.target.checked;save();render();};
  const LV=n=>LEVELS[n-1];
  app.querySelectorAll('[data-ju]').forEach(b=>b.onclick=()=>{const [n,i]=b.dataset.ju.split(':').map(Number);go({view:'lesson',n,li:i,i:0,review:true});});
  const ra=document.getElementById('revall'); if(ra) ra.onclick=()=>revGo(0);
  const rc=document.getElementById('revcont'); if(rc) rc.onclick=()=>revGo(S.revpos);
  app.querySelectorAll('[data-jt]').forEach(b=>b.onclick=()=>{const [n,i]=b.dataset.jt.split(':').map(Number);const le=LV(n).lessons[i];startQuiz({n,title:le.title,kind:'lesson',li:i,src:()=>le.quiz});});
  app.querySelectorAll('[data-je]').forEach(b=>b.onclick=()=>{const n=+b.dataset.je;startQuiz({n,title:`Eindtoets niveau ${n}`,kind:'exam',src:()=>examFor(n)});});
  app.querySelectorAll('[data-jo]').forEach(b=>b.onclick=()=>{const n=+b.dataset.jo;startQuiz({n,title:`Opfrissen niveau ${n}`,kind:'opfris',src:()=>opfrisFor(n)});});
  app.querySelectorAll('[data-jg]').forEach(b=>b.onclick=()=>go({view:'level',n:+b.dataset.jg,tab:'spel'}));
  const tf=document.getElementById('tf'); if(tf) tf.onsubmit=e=>{e.preventDefault();
    if(document.getElementById('tc').value.trim().toLowerCase()!==TRAINER_CODE){document.getElementById('tmsg').textContent='Die code klopt niet.';return;} trainerOk=true;render();};
  const tl=document.getElementById('tl'); if(tl) tl.onchange=()=>{P().unlock=+tl.value;save();};
  const al=document.getElementById('al'); if(al) al.onchange=()=>{S.applink=al.value.trim();save();};
  const mk=document.getElementById('mkqr'); if(mk) mk.onclick=()=>{
    S.applink=document.getElementById('al').value.trim();save();
    const box=document.getElementById('qr'), t=document.getElementById('qrt'); box.innerHTML='';
    if(!/^https:\/\//.test(S.applink)){t.textContent='Plak eerst de link van de app. Die vind je via Delen, rechtsboven in Claude.';return;}
    const link=S.applink.replace(/#.*$/,'')+'#les-'+document.getElementById('ql').value;
    if(typeof QRCode==='undefined'){t.textContent='De QR-maker kon niet laden. Probeer het later opnieuw.';return;}
    new QRCode(box,{text:link,width:170,height:170,correctLevel:QRCode.CorrectLevel.M});
    t.textContent=link; qrSaveBtn();
  };
}
async function qrSaveBtn(){
  const sv=await getSaver();
  const b=document.getElementById('saveqr'); if(!b||!sv) return; b.hidden=false;
  b.onclick=async()=>{const cv=document.querySelector('#qr canvas'); if(!cv) return;
    cv.toBlob(async bl=>{try{await sv('shuttle-school-qr-'+document.getElementById('ql').value+'.png',bl);}catch(e){}},'image/png');};
}

function choosePlayer(raw){
  const v=(raw||'').trim(); if(!v||v===S.current) return;
  if(S.profiles[v]){S.current=v;save();return;}
  const cp=S.profiles[S.current];
  const fresh=cp&&S.current==='Speler'&&!cp.shuttles&&!Object.keys(cp.lessons||{}).length&&!Object.keys(cp.passed||{}).length;
  if(fresh){S.profiles[v]=cp;delete S.profiles[S.current];} else S.profiles[v]=newProfile();
  S.current=v; save();
}
function fitLockup(){
  const svg=document.getElementById('sptitle'); if(!svg) return; const t=svg.querySelector('#sp-ss');
  try{const bb=t.getBBox(); if(bb.width) svg.setAttribute('viewBox',`${(bb.x-2).toFixed(1)} ${(bb.y+4).toFixed(1)} ${(bb.width+4).toFixed(1)} ${(bb.height-8).toFixed(1)}`);}catch(e){}
}
function splashView(){
  const arc='M60 870 Q150 520 455 465';
  const bg=`<svg class="sp-bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g transform="translate(259 233) rotate(28) scale(1.2)" opacity=".12"><g fill="none" stroke="#fff" stroke-width="4"><rect x="0" y="0" width="305" height="670"/><path d="M23 0V670M282 0V670M0 38H305M0 632H305M0 236.0H305M0 434.0H305M152.5 0V236.0M152.5 434.0V670"/><path d="M-30 335.0H335" stroke-width="7" stroke-dasharray="3 5"/></g></g>

  </svg>`;
  app.innerHTML=`
  <div class="splash2">
    ${bg}
    <div class="sp-top"><div class="sp-lock">
      <svg id="splock" viewBox="0 0 760 336" role="img" aria-label="Luck Raeck, badmintonvereniging Montfoort"><image href="${LOGO_W}" x="0" y="0" width="760" height="336"/></svg>
    </div>
    <div class="sp-mascot">${lucky('racket','lk-splash')}</div></div>
    <div class="sp-title"><svg id="sptitle" viewBox="0 0 900 120" role="img" aria-label="Luck Raeck’s Shuttle-school. Word de baas over de spelregels!"><text id="sp-ss" x="0" y="96" font-family="Fredoka, 'Baloo 2', 'Trebuchet MS', sans-serif" font-weight="700" font-size="100" fill="#ff9a3d">Luck Raeck’s Shuttle-school</text></svg><p class="sp-tg">Word de baas over de spelregels!</p></div>
    <p class="sp-catch"><span>Met Shuttle-school maak je</span><strong>spelenderwijs en stapje voor stapje</strong><span>kennis met de badmintonsport!</span></p>
    <form class="spname" id="spform"><label for="spn">Hoe heet je?</label>
      <div class="sp-in"><button type="button" class="spav" id="spav" aria-label="Kies een plaatje of foto" aria-expanded="false"></button><input type="text" id="spn" maxlength="20" value="${S.current&&S.current!=='Speler'?esc(S.current):''}" placeholder="Je voornaam" autocomplete="off"></div>
      <div class="sppick" id="sppick" hidden role="dialog" aria-label="Kies je plaatje">
        <div class="spp-h"><b>Kies je plaatje</b><button type="button" class="spp-x" id="sppx" aria-label="Sluiten">${I.cross}</button></div>
        <div class="spp-g">${AVS.map((_,i)=>avBtn(i,S.current&&S.current!=='Speler'?S.profiles[S.current]:null,false,'data-spav')).join('')}</div>
        <div class="spp-f"><label class="spp-b" for="splib">${I.image} Foto kiezen</label><input type="file" id="splib" accept="image/*" class="sr"><label class="spp-b" for="spcam">${I.camera} Selfie</label><input type="file" id="spcam" accept="image/*" capture="user" class="sr"></div>
        <p class="spp-m" id="sppm" role="status"></p>
      </div></form>
    <div class="spbot">
      <button class="bigbtn start pulse" id="start"><span class="bb1">Start</span>${I.play}</button>
      <div class="sprow sprow2"><span class="sp-r"><button type="button" class="linkbtn spsnd ${S.auto?'on':''}" id="spsnd" role="switch" aria-checked="${S.auto?'true':'false'}" aria-label="Geluid">${I.speaker}<span>Geluid</span><i class="sw" aria-hidden="true"></i></button><button class="linkbtn" id="splay">${I.speaker} Lees voor</button></span><label class="note"><input type="checkbox" id="nosplash" ${S.nosplash?'checked':''}> Dit scherm niet meer tonen</label></div>
      <p class="copy">© BV LUCK RAECK · versie ${APP_VERSION}${IS_TEST?' · <b class="envsp">TESTVERSIE</b>':''}</p>
    </div>
  </div>`;
  fitLockup(); if(document.fonts){document.fonts.load('700 100px Fredoka').then(fitLockup).catch(()=>{}); document.fonts.ready.then(fitLockup); document.fonts.onloadingdone=()=>fitLockup();}
  let pick=null; const spn=document.getElementById('spn'), spav=document.getElementById('spav'), pk=document.getElementById('sppick'), pm=document.getElementById('sppm');
  const drawAv=()=>{const nm=spn.value.trim(); let h;
    if(pick) h=pick.photo?photoSvg(pick.photo):avatar(pick.av);
    else if(nm&&S.profiles[nm]) h=avatarFor(nm);
    if(h){spav.innerHTML=h+`<span class="spav-e" aria-hidden="true">${I.pencil}</span>`;spav.classList.remove('empty');}
    else {spav.innerHTML=`<span class="spav-0">${I.camera}</span><span class="spav-e" aria-hidden="true">+</span>`;spav.classList.add('empty');}};
  drawAv(); spn.addEventListener('input',()=>{if(!pick)drawAv();});
  const openPk=o=>{pk.hidden=!o;spav.setAttribute('aria-expanded',o?'true':'false');if(o){pm.textContent='';const f=pk.querySelector('button[data-spav]');if(f)f.focus();}};
  spav.onclick=()=>openPk(pk.hidden); document.getElementById('sppx').onclick=()=>openPk(false);
  const spProf=()=>{const nm=spn.value.trim();return nm&&S.profiles[nm]?S.profiles[nm]:null;};
  const lockPk=()=>pk.querySelectorAll('[data-spav]').forEach(b=>{const i=+b.dataset.spav,o=avOpen(i,spProf());b.classList.toggle('avlock',!o);if(o){delete b.dataset.req;b.removeAttribute('aria-disabled');}else{b.dataset.req=AVS[i].req;b.setAttribute('aria-disabled','true');}});
  spn.addEventListener('input',lockPk); lockPk();
  pk.querySelectorAll('[data-spav]').forEach(b=>b.onclick=()=>{ if(b.dataset.req){pm.textContent=`🔒 ${AVS[+b.dataset.spav].n}: ${b.dataset.req} om dit plaatje te krijgen.`;return;} pick={av:+b.dataset.spav};drawAv();openPk(false);});
  ['splib','spcam'].forEach(id=>{const inp=document.getElementById(id); inp.onchange=()=>{const f=inp.files&&inp.files[0]; if(!f) return; pm.textContent='Foto wordt klaargezet…';

  const ss=document.getElementById('spsnd'); ss.onclick=()=>{S.auto=!S.auto;save();ss.classList.toggle('on',S.auto);ss.setAttribute('aria-checked',S.auto?'true':'false'); if(S.auto) kaching(.5);};
  const applyPick=()=>{ if(!pick||!S.current) return; const q=P();
    if(pick.av!=null){q.av=pick.av;delete q.photo;save();return;}
    const old=q.photo; q.photo=pick.photo; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){ if(old) q.photo=old; else delete q.photo; } };
  const startNow=()=>{hush(); choosePlayer(spn.value); applyPick(); if(cur.from==='settings'){go({view:'settings',tab:'algemeen'},'back');return;} if(!openFromHash()) go({view:'home'});};
  document.getElementById('start').onclick=startNow;
  document.getElementById('spform').onsubmit=e=>{e.preventDefault(); startNow();};
  document.getElementById('nosplash').onchange=e=>{S.nosplash=e.target.checked;save();};
  const sb=document.getElementById('splay'); sb.onclick=()=>speak(SPLASH_TXT,sb);
}
/* ---------- Directe link naar een les (QR op de hulpkaart) ---------- */
function openFromHash(){
  const m=/^#les-([a-z0-9-]+)$/.exec(location.hash||''); if(!m) return false;
  for(const l of LEVELS){const i=l.lessons.findIndex(x=>x.id===m[1]); if(i>=0){go({view:'lesson',n:l.n,li:i,i:0});return true;}}
  return false;
}
window.addEventListener('hashchange',openFromHash);

P(); if(S.nosplash){ if(!openFromHash()) go({view:'home'}); } else { cur={view:'splash'}; render(); }
