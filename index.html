<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1d55">
<meta name="description" content="Shuttle-school: leer spelenderwijs de spelregels van badminton. Luck Raeck jeugd.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Shuttle-school</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: één kolom app-scherm; niveaupad als route op de homepagina; sticky scorebalk; grote tikvlakken */
:root{
  --bg:#eef3fb; --surface:#ffffff; --fg:#122544; --muted:#5a6b88;
  --blue:#2b3bd8; --blue-soft:#dbe6f8; --orange:#f07f1a; --orange-soft:#fde8d4;
  --court:#2f7d5b; --court-line:#ffffff; --good:#1f8a4c; --good-soft:#d9f2e3; --bad:#c23b2b; --bad-soft:#fbe1dd;
  --line:#cfdaec; --lock:#9aa8c0; --on-accent:#ffffff;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1730; --surface:#14244a; --fg:#eaf0fb; --muted:#9fb0cf;
  --blue:#9aa4ff; --blue-soft:#1e3463; --orange:#ff9a3d; --orange-soft:#4a2e14;
  --court:#256b4d; --court-line:#f4f7fb; --good:#5fd08f; --good-soft:#173d2a; --bad:#ff7b6b; --bad-soft:#4a1f1a;
  --line:#2a3e6b; --lock:#5b6d93; --on-accent:#0c1730; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1730; --surface:#14244a; --fg:#eaf0fb; --muted:#9fb0cf;
  --blue:#9aa4ff; --blue-soft:#1e3463; --orange:#ff9a3d; --orange-soft:#4a2e14;
  --court:#256b4d; --court-line:#f4f7fb; --good:#5fd08f; --good-soft:#173d2a; --bad:#ff7b6b; --bad-soft:#4a1f1a;
  --line:#2a3e6b; --lock:#5b6d93; --on-accent:#0c1730; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1d1d55}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1d1d55;color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;flex:1;min-width:0;background:none;border:0;color:#fff;text-align:left;padding:0}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
.pot{display:flex;align-items:center;gap:6px;background:#fff;color:#2b3bd8;border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pot svg{width:30px;height:30px}
.pot.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.iconbtn{background:rgba(255,255,255,.16);border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:#fff}
.iconbtn svg{width:22px;height:22px}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px} h2{font-size:23px} h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-family:var(--display);font-weight:600;font-size:18px;background:var(--blue);color:var(--on-accent);display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--blue-soft);color:var(--blue)}
.btn.go{background:var(--orange);color:#fff}
.btn svg{width:20px;height:20px}
.btn.small{padding:8px 14px;font-size:16px}
/* niveaupad */
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.path::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;width:4px;border-radius:4px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 18px)}
.stop{position:relative;display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 14px 14px 0;width:100%;margin-left:-34px}
.stop:hover:not(.locked){border-color:var(--blue)}
.stop .num{flex:none;width:68px;height:68px;margin-left:0;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;background:var(--blue);color:var(--on-accent);border:5px solid var(--bg);position:relative;left:-2px}
.stop.passed .num{background:var(--orange);color:#fff}
.stop.locked{opacity:.7}
.stop.locked .num{background:var(--lock);color:#fff}
.stop .num svg{width:28px;height:28px}
.stop .txt{min-width:0;flex:1}
.stop b{font-family:var(--display);font-size:20px;display:block}
.stop .sub{font-size:14px;color:var(--muted)}
.progress{height:8px;background:var(--blue-soft);border-radius:8px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--orange);border-radius:8px;transition:width .3s}
.medal{flex:none;width:40px;height:40px}
/* lijsten */
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.item:hover:not(:disabled){border-color:var(--blue)}
.item:disabled{opacity:.55}
.item .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-family:var(--display);font-weight:700;font-size:18px}
.item .ic svg{width:24px;height:24px}
.item.game .ic{background:var(--orange-soft);color:var(--orange)}
.item.exam{border-color:var(--orange)}
.item.exam .ic{background:var(--orange);color:#fff}
.item .t{flex:1;min-width:0}
.item .t b{font-family:var(--display);font-size:18px;display:block}
.item .t span{font-size:14px;color:var(--muted)}
.tag{font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag.ok{color:var(--good)} .tag.lock{color:var(--lock)}
.tag svg{width:18px;height:18px}
.games{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
/* les en vraag */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px}
.art{display:flex;justify-content:center;position:relative}
.art svg{max-width:100%;height:auto;touch-action:manipulation}
.say{font-size:21px;line-height:1.45}
.say strong{color:var(--blue)}
.speak{flex:none;border:0;background:var(--orange);color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.speak svg{width:26px;height:26px}
.speak.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--orange-soft)}}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--orange)}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;font-size:19px;font-family:var(--display);font-weight:600;text-align:left;min-height:58px}
.opts.two .opt,.opts.three .opt{text-align:center;font-size:21px}
.opts.three .opt{font-size:18px;padding:12px 6px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.blauw{border-color:#2b3bd8;color:#2b3bd8} .opt.oranje{border-color:#f07f1a;color:#c45f08}
:root[data-theme="dark"] .opt.blauw{color:#9cc0ff} :root[data-theme="dark"] .opt.oranje{color:#ffb06a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.blauw{color:#9cc0ff}:root:not([data-theme="light"]) .opt.oranje{color:#ffb06a}}
.fb{border-radius:16px;padding:14px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-family:var(--display)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--blue);font-family:var(--display);font-weight:600;font-size:17px;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.back svg{width:18px;height:18px}
.big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--blue);text-align:center;font-variant-numeric:tabular-nums}
.hint{font-family:var(--display);font-weight:600;color:var(--orange);text-align:center}
.timer{height:10px;border-radius:10px;background:var(--orange-soft);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left}
.board{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;background:#122544;color:#fff;border-radius:16px;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:24px;min-width:240px}
.board .sc{font-size:34px;font-variant-numeric:tabular-nums;text-align:right;color:#ffd08a}
.board .sv{width:26px;height:26px}
.koker{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.koker svg{width:26px;height:26px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px}
.badge.locked{opacity:.4}
.badge svg{width:16px;height:16px}
.profiles{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700}
.chip.on{border-color:var(--orange);background:var(--orange-soft)}
input[type=text],input[type=password],select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.fly{position:fixed;z-index:20;width:34px;height:34px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .8s}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--orange-soft);border-radius:14px;padding:12px;font-size:15px}
.hero{display:flex;gap:14px;align-items:center}
.hero svg{flex:none;width:72px;height:72px}
.miss{border-left:4px solid var(--bad);padding:8px 12px;background:var(--bad-soft);border-radius:0 12px 12px 0;font-size:16px}
.miss b{font-family:var(--display)}
.rule{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.rule svg{width:22px;height:22px;flex:none;color:var(--orange)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:26px}.say{font-size:19px}.big{font-size:46px}.board{font-size:20px;min-width:0;width:100%}}

/* ===== Eén scherm, geen scrollen: hoogte = venster, inhoud schaalt mee ===== */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.bar{position:relative;top:auto;flex:none;padding-block:8px}
.brand{font-size:20px}
.pot{font-size:18px;padding:3px 10px 3px 5px}.pot svg{width:26px;height:26px}
.iconbtn{width:38px;height:38px}
main{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;padding-block:12px;gap:10px}
main>*{flex:none}
h1{font-size:clamp(21px,3.4vh,28px)} h2{font-size:clamp(18px,2.8vh,22px)}
.small{font-size:14px}
.hero{gap:10px}.heroic{flex:none;width:48px;height:48px}.heroic svg{width:48px;height:48px}
.path{gap:8px}
.path::before{top:22px;bottom:22px}
.stop{padding:8px 10px 8px 0;border-radius:16px}
.stop .num{width:50px;height:50px;font-size:24px;border-width:4px}
.stop b{font-size:17px}.stop .sub{font-size:13px;display:block}
.stop .progress{height:6px;margin-top:4px}
.medal{width:32px;height:32px}
.tabs{display:flex;gap:6px;background:var(--blue-soft);padding:4px;border-radius:14px}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--blue)}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;gap:8px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px;min-height:52px;min-width:0}
.tile:hover:not(:disabled){border-color:var(--blue)}
.tile:disabled{opacity:.5}
.tile .tn{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-family:var(--display);font-weight:700;font-size:16px}
.tile .tn svg{width:18px;height:18px}
.tile.done .tn{background:var(--good-soft);color:var(--good)}
.tile.game .tn{background:var(--orange-soft);color:var(--orange)}
.tile .tt{min-width:0;font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2}
.tile .tt small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.item{padding:8px 12px}.item .ic{width:38px;height:38px}
.item .t b{font-size:16px}.item .t span{font-size:13px}
.stage{flex:1 1 auto;min-height:0;padding:12px;gap:10px;border-radius:18px}
.stage.center{text-align:center;align-items:center;justify-content:center}
.art{flex:1 1 0;min-height:80px;align-items:center;overflow:hidden}
.art>svg{height:100%;width:auto;max-width:100%;max-height:100%}
.art>div{max-height:100%}
.art>div[style*="width:110px"]{width:auto!important;height:100%!important;max-height:110px;aspect-ratio:1}
.art>div[style*="width:110px"] svg{width:100%;height:100%}
.qrow{display:flex;gap:10px;align-items:flex-start;flex:none}
.say{font-size:clamp(15px,2.35vh,20px);line-height:1.4}
.speak{width:42px;height:42px}.speak svg{width:22px;height:22px}
.opts{flex:none;gap:8px}
.opt{min-height:44px;padding:9px 12px;font-size:16px;border-radius:14px}
.opts.two .opt,.opts.three .opt{font-size:18px}
.opts.three .opt{font-size:16px;padding:9px 4px}
.opts.four{grid-template-columns:1fr 1fr}.opts.four .opt{font-size:14px;padding:8px 8px;line-height:1.25}
.fb{flex:none;padding:10px 12px;font-size:15px;line-height:1.35;align-items:center;gap:8px}
.fbt{flex:1;min-width:0}
.fb .btn{flex:none}
.note{font-size:13px}
.hint{flex:none;margin:0}
.timer{flex:none}
.navrow{display:flex;justify-content:space-between;gap:10px;flex:none}
.navcol{display:flex;flex-direction:column;gap:10px;align-items:center;flex:none}
.big{font-size:clamp(36px,6vh,56px)}
.resic{width:clamp(48px,9vh,84px)}
.earn{font-family:var(--display);font-weight:700;font-size:20px}
.board{font-size:20px;padding:10px 16px;min-width:220px}.board .sc{font-size:28px}
.btn{padding:10px 16px;font-size:17px}
.btn.small{padding:7px 12px;font-size:15px}
.card{padding:12px}
.dots i{width:8px;height:8px}
@media (max-height:640px){.stop .progress{display:none}.say{font-size:15px}.opt{min-height:40px}}

.stage{position:relative}
.hintbtn{flex:none;margin-left:auto;width:42px;height:42px;border-radius:50%;border:2px solid #f5c542;background:#fff7d6;display:grid;place-items:center;padding:0}
.hintbtn svg{width:28px;height:28px}
.hintpanel{position:absolute;inset:0;z-index:3;background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;border:2px solid #f5c542}
.hph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.hlab{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:18px;color:#b07a00}
.hlab svg{width:26px;height:26px}
:root[data-theme="dark"] .hintbtn{background:#3a3214} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hintbtn{background:#3a3214}}

.bigbtn{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;gap:0 12px;width:100%;text-align:left;border:0;border-radius:18px;background:var(--orange);color:#fff;padding:12px 16px;box-shadow:0 3px 0 #c45f08}
.bigbtn .bb1{font-family:var(--display);font-weight:700;font-size:22px}
.bigbtn .bb2{grid-column:1;font-size:14px;opacity:.95}
.bigbtn svg{grid-row:1/3;grid-column:2;width:30px;height:30px}
.item.bak{border-color:var(--orange)} .item.bak .ic{background:var(--orange-soft);color:var(--orange)}
.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.tb.off{opacity:.5}.tbi{width:20px;height:20px;color:var(--blue)}.tbi svg{width:20px;height:20px}
.tbs{font-size:11px;letter-spacing:1px;color:var(--orange);line-height:1}
.tile.opf{border-color:var(--orange)}.tile.opf .tn{background:var(--orange);color:#fff}
.ltitle{display:flex;align-items:center;gap:8px}.tic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}.tic svg{width:20px;height:20px}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.opts.pics .opt{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;line-height:1.2;padding:6px}
.opic{display:block;height:clamp(40px,7vh,64px);color:var(--blue)}.opic svg{height:100%;width:auto;max-width:100%}
.opt svg{vertical-align:-4px}
.tbl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}

.qrbox{flex:none;background:#fff;padding:6px;border-radius:8px;min-width:0}.qrbox:empty{display:none}
body.bigtext .say{font-size:clamp(18px,2.9vh,24px)} body.bigtext .opt{font-size:19px} body.bigtext .opts.four .opt{font-size:16px} body.bigtext .tile .tt{font-size:16px}

.splash{flex:1 1 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px;text-align:center;padding-block:clamp(8px,3vh,32px)}
.logo{flex:none;width:min(100%,340px);background:#fff;border-radius:20px;padding:clamp(10px,2vh,18px) 18px;box-shadow:0 2px 10px rgba(29,29,85,.10)}
.logo img{display:block;width:100%;height:auto;max-height:22vh;object-fit:contain}

/* =========================================================
   OPSLAG (per apparaat, per speler)
   ========================================================= */
const KEY='shuttleschool-v1';
const TRAINER_CODE='luckraeck';
let S={profiles:{},current:null,voice:'',rate:0.9,auto:true};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function newProfile(){return {shuttles:0,lessons:{},passed:{},best:{},unlock:1,opfris:{},bak:[],passedAt:{}};}
function P(){
  if(!S.current||!S.profiles[S.current]){ S.profiles['Speler']=S.profiles['Speler']||newProfile(); S.current='Speler'; }
  const p=S.profiles[S.current]; if(!p.lessons) p.lessons={}; if(!p.passed) p.passed={}; if(!p.best) p.best={}; if(!p.unlock) p.unlock=1; if(!p.opfris) p.opfris={}; if(!p.bak) p.bak=[]; if(!p.passedAt) p.passedAt={}; return p;
}
function setPot(){document.getElementById('potn').textContent=P().shuttles;}

/* =========================================================
   STEM: alleen Nederlandse stemmen, vrouwenstem voorkeur
   ========================================================= */
const synth=window.speechSynthesis;
let voices=[];
const FEMALE=/claire|fenna|colette|ellen|hanna|femke|lotte|laura|anna|sanne|nl-nl-standard-a|nl-nl-standard-d|nl-nl-standard-e|nl-nl-wavenet-a|nl-nl-wavenet-d|nl-nl-wavenet-e|female|vrouw|google nederlands/i;
const MALE=/xander|maarten|frank|willem|arnaud|bram|male\b|\bman\b|standard-b|standard-c|wavenet-b|wavenet-c/i;
let allVoices=[];
function loadVoices(){ if(!synth) return; try{allVoices=synth.getVoices().slice();voices=allVoices.filter(v=>/^nl/i.test(v.lang));}catch(e){voices=[];allVoices=[];} }
function rankVoice(v){ let s=0; if(/nl[-_]NL/i.test(v.lang)) s+=10; if(FEMALE.test(v.name)) s+=6; if(MALE.test(v.name)) s-=20; if(/natural|neural|premium|enhanced|verbeterd|online/i.test(v.name)) s+=3; return s; }
function pickVoice(){ loadVoices(); if(S.voice){const f=allVoices.find(v=>v.name===S.voice); if(f) return f;} return voices.slice().sort((a,b)=>rankVoice(b)-rankVoice(a))[0]||null; }
if(synth){ loadVoices(); synth.onvoiceschanged=()=>{loadVoices(); if(cur.view==='settings') render();};
  /* iPhone/iPad geven stemmen vaak pas later door: een paar keer opnieuw vragen */
  let tries=0, last=-1; const poll=setInterval(()=>{loadVoices(); if(allVoices.length!==last){last=allVoices.length; if(typeof cur!=='undefined'&&cur.view==='settings') render();} if(++tries>20) clearInterval(poll);},500); }
let speakingBtn=null;
function spoken(text){
  return text.replace(/<[^>]+>/g,'').replace(/(\d+)\s*[–-]\s*(\d+)/g,'$1 $2').replace(/1,15 m\b/g,'1 meter 15').replace(/1,55 m\b/g,'1 meter 55').replace(/1,524 m\b/g,'1 meter 52')
    .replace(/(\d+) s\b/g,'$1 seconden').replace(/ · /g,', ');
}
function speak(text,btn,forced){
  if(!synth||!text) return;
  try{synth.cancel();}catch(e){}
  if(speakingBtn) speakingBtn.classList.remove('on');
  const u=new SpeechSynthesisUtterance(spoken(text));
  const v=forced||pickVoice(); u.lang=v?v.lang:'nl-NL'; if(v) u.voice=v; u.rate=S.rate; u.pitch=1.05;
  if(btn){speakingBtn=btn; btn.classList.add('on'); u.onend=u.onerror=()=>btn.classList.remove('on');}
  try{synth.speak(u);}catch(e){}
}
function hush(){ if(synth) try{synth.cancel();}catch(e){} }

/* =========================================================
   BAAN (meters; net op y=0; eigen helft onderaan, y>0)
   ========================================================= */
const W=6.1, L=6.7, SS=1.98, LD=5.94, SI=0.46;
const AREAS={
  enkel:{x0:SI,x1:W-SI,y0:0,y1:L,name:'de enkelspelbaan'},
  dubbel:{x0:0,x1:W,y0:0,y1:L,name:'de dubbelspelbaan'},
  enkelservice:{x0:SI,x1:W/2,y0:SS,y1:L},
  dubbelservice:{x0:0,x1:W/2,y0:SS,y1:LD}
};
function court(o){
  o=o||{}; const full=o.full, s=o.s||(full?24:34), m=14;
  const ymin=full?-L-0.5:-0.35, ymax=L+0.6, xmin=-0.6, xmax=W+0.6;
  const X=x=>((x-xmin)*s).toFixed(1), Y=y=>((y-ymin)*s).toFixed(1);
  const w=((xmax-xmin)*s).toFixed(0), h=((ymax-ymin)*s+m).toFixed(0);
  let g=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" data-s="${s}" data-xmin="${xmin}" data-ymin="${ymin}" role="img" aria-label="${o.label||'Badmintonbaan van bovenaf'}">`;
  g+=`<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="2" stroke-opacity=".35"/></pattern></defs><rect x="0" y="0" width="${w}" height="${h}" rx="14" fill="var(--blue-soft)"/>`;
  const y0=full?-L:0;
  g+=`<rect x="${X(0)}" y="${Y(y0)}" width="${(W*s).toFixed(1)}" height="${((L-y0)*s).toFixed(1)}" fill="var(--court)"/>`;
  (o.areas||[]).forEach(a=>{const A=typeof a==='string'?AREAS[a]:a;
    g+=`<rect x="${X(A.x0)}" y="${Y(A.y0)}" width="${((A.x1-A.x0)*s).toFixed(1)}" height="${((A.y1-A.y0)*s).toFixed(1)}" fill="${A.c||'#ff9a3d'}" fill-opacity="${A.op||.82}"${A.c?'':' stroke="#f07f1a" stroke-width="3"'}/>`;
    if(!A.c&&!A.op) g+=`<rect x="${X(A.x0)}" y="${Y(A.y0)}" width="${((A.x1-A.x0)*s).toFixed(1)}" height="${((A.y1-A.y0)*s).toFixed(1)}" fill="url(#hatch)"/>`;});
  const ln=(x1,y1,x2,y2)=>`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="var(--court-line)" stroke-width="${Math.max(2,s*0.07).toFixed(1)}"/>`;
  (full?[-1,1]:[1]).forEach(d=>{
    g+=ln(0,0,0,d*L)+ln(W,0,W,d*L)+ln(SI,0,SI,d*L)+ln(W-SI,0,W-SI,d*L);
    g+=ln(0,d*L,W,d*L)+ln(0,d*LD,W,d*LD)+ln(0,d*SS,W,d*SS)+ln(W/2,d*SS,W/2,d*L);
  });
  g+=`<line x1="${X(-0.45)}" y1="${Y(0)}" x2="${X(W+0.45)}" y2="${Y(0)}" stroke="var(--fg)" stroke-width="4" stroke-dasharray="3 3"/>`;
  g+=`<circle cx="${X(-0.45)}" cy="${Y(0)}" r="5" fill="var(--fg)"/><circle cx="${X(W+0.45)}" cy="${Y(0)}" r="5" fill="var(--fg)"/>`;
  if(o.lab) o.lab.forEach(t=>g+=`<g><rect x="${(+X(t[0])-t[2].length*4.6-8).toFixed(1)}" y="${(+Y(t[1])-14).toFixed(1)}" width="${(t[2].length*9.2+16).toFixed(1)}" height="22" rx="11" fill="var(--surface)" opacity=".92"/><text x="${X(t[0])}" y="${(+Y(t[1])+2).toFixed(1)}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="14" fill="var(--fg)">${t[2]}</text></g>`);
  if(o.text) o.text.forEach(t=>g+=`<text x="${X(t[0])}" y="${Y(t[1])}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="${t[3]||18}" fill="${t[4]||'#fff'}">${t[2]}</text>`);
  if(o.player) o.player.forEach(p=>{g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${(s*0.32).toFixed(1)}" fill="${p[2]||'#2b3bd8'}" stroke="#fff" stroke-width="3"/>`;
    if(p[3]) g+=`<text x="${X(p[0])}" y="${(+Y(p[1])+s*0.32+16).toFixed(1)}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="15" fill="#fff" stroke="#123" stroke-width="3" paint-order="stroke">${p[3]}</text>`;
    if(p[4]) g+=`<g transform="translate(${(+X(p[0])+s*0.2).toFixed(1)} ${(+Y(p[1])-s*0.75).toFixed(1)}) scale(.75)">${SHUTTLE_INNER}</g>`;});
  if(o.opp) g+=`<circle cx="${X(o.opp[0])}" cy="${Y(o.opp[1])}" r="${(s*0.34).toFixed(1)}" fill="#f07f1a" stroke="#fff" stroke-width="3"/>`;
  if(o.dot){const [x,y]=o.dot; const tx=+X(x), ty=+Y(y);
    const f=o.from||(o.player&&o.player[0])||null; let sx,sy;
    if(f){sx=+X(f[0]);sy=+Y(f[1]);} else if(full){sx=+X(W/2);sy=+Y(L-1);} else {sx=+X(W/2+(x-W/2)*0.3);sy=+Y(-0.3);}
    const ang=Math.atan2(ty-sy,tx-sx)*180/Math.PI-90, k=s/24;
    const tf=(px,py,sc)=>`translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${sc.toFixed(2)}) translate(-16 -26)`;
    g+=`<g class="landing" data-tx="${tx}" data-ty="${ty}" data-sx="${sx}" data-sy="${sy}" data-a="${ang}" data-k="${k}">`
      +`<line class="trail" x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}" stroke="#ffd08a" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>`
      +`<circle class="mark" cx="${tx}" cy="${ty}" r="${(s*0.2).toFixed(1)}" fill="none" stroke="#fff" stroke-width="3"/><circle class="mark" cx="${tx}" cy="${ty}" r="${(s*0.2).toFixed(1)}" fill="none" stroke="#c23b2b" stroke-width="1.4"/>`
      +`<g class="shut" transform="${tf(tx,ty,k)}">${SHUTTLE_INNER}</g></g>`;}
  if(o.tap){const e=o.tap==='dubbel'?0:SI, b=o.tap==='dubbel'?LD:L;
    g+=`<rect class="tapL" x="${X(e)}" y="${Y(SS)}" width="${((W/2-e)*s).toFixed(1)}" height="${((b-SS)*s).toFixed(1)}" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="6 5" style="cursor:pointer"/><rect class="tapR" x="${X(W/2)}" y="${Y(SS)}" width="${((W/2-e)*s).toFixed(1)}" height="${((b-SS)*s).toFixed(1)}" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="6 5" style="cursor:pointer"/>`;}
  return g+'</svg>';
}

/* zijaanzicht: twee spelers met het net ertussen (voor "wie krijgt het punt?") */
function scene(o){
  const sh=(x,y,r,sc)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${sc||1.3}) translate(-16 -16)">${SHUTTLE_INNER}</g>`;
  const kid=(x,c,flip)=>`<g><circle cx="${x}" cy="88" r="13" fill="${c}"/><rect x="${x-13}" y="104" width="26" height="40" rx="10" fill="${c}"/><rect x="${x-9}" y="140" width="7" height="18" rx="3" fill="${c}"/><rect x="${x+2}" y="140" width="7" height="18" rx="3" fill="${c}"/></g>`;
  let g=`<svg viewBox="0 0 340 190" width="340" height="190" role="img" aria-label="Twee spelers aan weerszijden van het net"><rect width="340" height="190" rx="14" fill="var(--blue-soft)"/>`;
  g+=`<rect x="0" y="158" width="340" height="32" fill="var(--court)"/><rect x="22" y="158" width="4" height="6" fill="#fff"/><rect x="314" y="158" width="4" height="6" fill="#fff"/>`;
  g+=`<rect x="167" y="70" width="6" height="88" fill="var(--fg)"/><rect x="160" y="68" width="20" height="6" rx="2" fill="#fff" stroke="var(--fg)"/>`;
  g+=`<g opacity=".35">`; for(let i=0;i<8;i++) g+=`<line x1="163" y1="${78+i*9}" x2="177" y2="${78+i*9}" stroke="var(--fg)"/>`; g+=`</g>`;
  g+=kid(70,'#2b3bd8')+kid(270,'#f07f1a');
  g+=`<text x="70" y="182" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="#fff">Blauw</text><text x="270" y="182" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="#fff">Oranje</text>`;
  const racketL=(x2,y2)=>`<line x1="82" y1="112" x2="${x2}" y2="${y2}" stroke="#123" stroke-width="3"/><ellipse cx="${x2}" cy="${y2}" rx="8" ry="11" fill="none" stroke="#123" stroke-width="3"/>`;
  const racketR=(x2,y2)=>`<line x1="258" y1="112" x2="${x2}" y2="${y2}" stroke="#123" stroke-width="3"/><ellipse cx="${x2}" cy="${y2}" rx="8" ry="11" fill="none" stroke="#123" stroke-width="3"/>`;
  const k=o.k;
  if(k==='groundL') g+=racketL(96,96)+racketR(240,92)+sh(120,150,180);
  if(k==='groundR') g+=racketL(96,96)+racketR(240,92)+sh(220,150,180);
  if(k==='outR') g+=racketL(96,96)+racketR(240,92)+sh(328,150,180)+`<path d="M90 90 Q200 0 326 138" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='outL') g+=racketL(96,96)+racketR(240,92)+sh(12,150,180)+`<path d="M250 90 Q140 0 14 138" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='lineR') g+=racketL(96,96)+racketR(240,92)+sh(316,150,180)+`<rect x="312" y="158" width="8" height="4" fill="#fff"/>`;
  if(k==='netL') g+=racketL(96,96)+racketR(240,92)+sh(160,120,200)+`<path d="M90 95 Q130 70 158 112" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='netR') g+=racketL(96,96)+racketR(240,92)+sh(180,120,160)+`<path d="M250 95 Q210 70 182 112" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='touchL') g+=racketL(160,76)+racketR(240,92)+sh(110,40,160)+`<circle cx="164" cy="74" r="14" fill="none" stroke="#c23b2b" stroke-width="3"/>`;
  if(k==='touchR') g+=racketL(96,96)+racketR(180,76)+sh(230,40,200)+`<circle cx="176" cy="74" r="14" fill="none" stroke="#c23b2b" stroke-width="3"/>`;
  if(k==='bodyL') g+=racketL(96,96)+racketR(240,92)+sh(58,118,140)+`<path d="M240 90 Q150 30 64 112" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='bodyR') g+=racketL(96,96)+racketR(240,92)+sh(282,118,220)+`<path d="M100 90 Q190 30 276 112" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='underL') g+=racketL(96,96)+racketR(240,92)+sh(205,150,90)+`<path d="M95 140 L200 150" fill="none" stroke="#c23b2b" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='rally') g+=racketL(96,96)+racketR(240,92)+sh(170,26,150)+`<path d="M96 90 Q170 0 244 88" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  if(k==='svchoog'||k==='svcgoed'||k==='svcvoet'){
    const bad=k!=='svcgoed';
    g+=`<line x1="20" y1="108" x2="160" y2="108" stroke="#f07f1a" stroke-width="2.5" stroke-dasharray="7 5"/><text x="24" y="102" font-family="Fredoka" font-weight="700" font-size="13" fill="var(--fg)">1,15 m</text>`;
    if(k==='svchoog') g+=`<g><animateTransform attributeName="transform" type="rotate" values="70 82 112;0 82 112;70 82 112" dur="1.8s" repeatCount="indefinite"/><line x1="82" y1="112" x2="104" y2="76" stroke="#123" stroke-width="3"/><ellipse cx="104" cy="76" rx="8" ry="11" fill="none" stroke="#123" stroke-width="3"/></g>`+sh(114,74,200,1)+`<text x="250" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="18" fill="#c23b2b">te hoog: fout</text>`;
    if(k==='svcgoed') g+=`<g><animateTransform attributeName="transform" type="rotate" values="-60 82 112;0 82 112;-60 82 112" dur="1.8s" repeatCount="indefinite"/><line x1="82" y1="112" x2="98" y2="132" stroke="#123" stroke-width="3"/><ellipse cx="98" cy="132" rx="8" ry="11" fill="none" stroke="#123" stroke-width="3"/></g><g><animateMotion dur="1.8s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;0.5;1" calcMode="linear" path="M0 0 Q90 -130 190 22"/>${sh(108,126,210,1)}</g><text x="250" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="18" fill="var(--good)">onder 1,15 m: goed</text>`;
    if(k==='svcvoet') g+=racketL(98,128)+sh(108,124,210,1)+`<rect x="72" y="140" width="7" height="18" rx="3" fill="#c23b2b"><animate attributeName="x" values="72;90;72" dur="1.6s" repeatCount="indefinite"/></rect><text x="250" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="18" fill="#c23b2b">voet schuift: fout</text>`;
  }
  if(k==='serve') g+=racketL(98,128)+racketR(240,92)+sh(112,122,210,1.1)+`<path d="M112 120 Q190 10 290 150" fill="none" stroke="#f07f1a" stroke-width="3" stroke-dasharray="6 6"/>`;
  return g+'</svg>';
}
function bigArt(t,sub){return `<div style="text-align:center"><div class="big">${t}</div>${sub?`<div class="label" style="margin-top:6px">${sub}</div>`:''}</div>`;}
function iconArt(name){return `<div style="width:110px;height:110px">${I[name]||''}</div>`;}
function picArt(p){
  if(p.scene) return scene({k:p.scene});
  if(p.icon) return I[p.icon]||'';
  if(p.txt) return `<svg viewBox="0 0 60 40"><text x="30" y="30" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="28" fill="currentColor">${p.txt}</text></svg>`;
  if(p.kids){let g='<svg viewBox="0 0 '+(p.kids*18+4)+' 34">';for(let i=0;i<p.kids;i++){const x=11+i*18,c=i<2?'#2b3bd8':'#f07f1a';g+=`<circle cx="${x}" cy="8" r="5" fill="${c}"/><rect x="${x-6}" y="14" width="12" height="16" rx="5" fill="${c}"/>`;}return g+'</svg>';}
  return '';
}
function netArt(kind){
  const sh=(x,y,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(1.4) translate(-16 -16)">${SHUTTLE_INNER}</g>`;
  let g=`<svg viewBox="0 0 300 170" width="300" height="170"><rect width="300" height="170" rx="14" fill="var(--blue-soft)"/><rect x="0" y="150" width="300" height="20" fill="var(--court)"/>`;
  g+=`<rect x="146" y="60" width="8" height="90" fill="var(--fg)"/><rect x="138" y="58" width="24" height="6" rx="2" fill="#fff" stroke="var(--fg)"/>`;
  if(kind==='over') g+=`<path d="M40 130 Q150 -10 250 130" fill="none" stroke="#f07f1a" stroke-width="4" stroke-dasharray="8 7"/>`+sh(250,128,150);
  if(kind==='netrand') g+=`<path d="M40 120 Q120 40 150 58 Q175 70 240 140" fill="none" stroke="#f07f1a" stroke-width="4" stroke-dasharray="8 7"/>`+sh(242,138,160)+`<text x="236" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="20" fill="var(--good)">doorspelen</text>`;
  if(kind==='onder') g+=`<path d="M40 140 L250 140" fill="none" stroke="#c23b2b" stroke-width="4" stroke-dasharray="8 7"/>`+sh(255,138,90)+`<text x="150" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#c23b2b">fout</text>`;
  if(kind==='innet') g+=`<path d="M40 120 Q100 60 146 100" fill="none" stroke="#c23b2b" stroke-width="4" stroke-dasharray="8 7"/>`+sh(144,104,200)+`<text x="230" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#c23b2b">fout</text>`;
  if(kind==='plafond'){g=`<svg viewBox="0 0 300 190" width="300" height="190"><rect width="300" height="190" rx="14" fill="var(--blue-soft)"/><rect x="0" y="0" width="300" height="22" fill="var(--fg)" opacity=".55"/><text x="150" y="16" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14" fill="#fff">plafond</text><rect x="0" y="170" width="300" height="20" fill="var(--court)"/><rect x="146" y="90" width="8" height="80" fill="var(--fg)"/><rect x="138" y="88" width="24" height="6" rx="2" fill="#fff" stroke="var(--fg)"/><path d="M40 160 Q70 20 108 26" fill="none" stroke="#c23b2b" stroke-width="4" stroke-dasharray="8 7"/>`+sh(112,36,200)+`<text x="220" y="60" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#c23b2b">fout</text>`;}
  if(kind==='dopin'||kind==='dopuit'){const inn=kind==='dopin'; const cx=inn?150:178;
    g=`<svg viewBox="0 0 300 170" width="300" height="170" role="img" aria-label="Shuttle op de grond bij een lijn, van dichtbij"><rect width="300" height="170" rx="14" fill="var(--blue-soft)"/><rect x="0" y="22" width="140" height="126" fill="var(--court)"/><rect x="140" y="22" width="16" height="126" fill="#fff"/><rect x="156" y="22" width="144" height="126" fill="var(--court)" opacity=".55"/>`
     +`<text x="70" y="16" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="var(--fg)">binnen</text><text x="148" y="16" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="var(--fg)">lijn</text><text x="228" y="16" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="var(--fg)">buiten</text>`
     +`<g transform="translate(${cx} 86) rotate(${inn?90:-90}) scale(2.3) translate(-16 -26)">${SHUTTLE_INNER}</g>`
     +`<circle cx="${cx}" cy="86" r="13" fill="none" stroke="#c23b2b" stroke-width="3" stroke-dasharray="4 3"/>`
     +`<text x="150" y="165" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="16" fill="${inn?'var(--good)':'var(--bad)'}">${inn?'dopje op de lijn: IN':'dopje buiten de lijn: UIT'}</text>`;}
  if(kind==='lava'){g=`<svg viewBox="0 0 300 170" width="300" height="170"><rect width="300" height="170" rx="14" fill="var(--blue-soft)"/><path d="M0 140 Q30 128 60 140 T120 140 T180 140 T240 140 T300 140 V170 H0Z" fill="#f07f1a"/><path d="M0 152 Q30 142 60 152 T120 152 T180 152 T240 152 T300 152 V170 H0Z" fill="#c23b2b"/>`+sh(150,55,170)+`<path d="M150 90 v25" stroke="#f07f1a" stroke-width="3" stroke-dasharray="4 5"/>`;}
  if(kind==='hoogte'){g=`<svg viewBox="0 0 300 190" width="300" height="190"><rect width="300" height="190" rx="14" fill="var(--blue-soft)"/><rect x="0" y="170" width="300" height="20" fill="var(--court)"/><line x1="20" y1="95" x2="280" y2="95" stroke="#f07f1a" stroke-width="3" stroke-dasharray="8 6"/><text x="24" y="86" font-family="Fredoka" font-weight="700" font-size="18" fill="var(--fg)">1,15 m</text>`+sh(170,128,170)+`<text x="200" y="134" font-family="Fredoka" font-weight="700" font-size="16" fill="var(--good)">goed: eronder</text>`;}
  if(kind==='net'){g=`<svg viewBox="0 0 300 190" width="300" height="190"><rect width="300" height="190" rx="14" fill="var(--blue-soft)"/><rect x="0" y="170" width="300" height="20" fill="var(--court)"/><rect x="30" y="50" width="6" height="120" fill="var(--fg)"/><rect x="264" y="50" width="6" height="120" fill="var(--fg)"/><path d="M36 54 Q150 62 264 54" fill="none" stroke="#fff" stroke-width="6"/><path d="M36 54 Q150 62 264 54 L264 110 Q150 118 36 110Z" fill="var(--fg)" opacity=".25"/><text x="44" y="40" font-family="Fredoka" font-weight="700" font-size="15" fill="var(--fg)">paal: 1,55 m</text><text x="150" y="86" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="var(--fg)">midden: 1,524 m</text>`;}
  return g+'</svg>';
}
function art(a){
  if(!a) return '';
  if(a.court) return court(a.court);
  if(a.scene) return scene(a.scene);
  if(a.big) return bigArt(a.big,a.sub);
  if(a.icon) return iconArt(a.icon);
  if(a.net) return netArt(a.net);
  if(a.board) return boardArt(a.board);
  return '';
}
function boardArt(b){
  return `<div class="board" aria-label="Scorebord">${b.map(r=>`<span>${r[0]}</span><span class="sv">${r[2]?I.shuttle:''}</span><span class="sc">${r[1]}</span>`).join('')}</div>`;
}

/* Wedstrijd-simulatie: het einde van één game, rally voor rally */
function simGame(sys){
  const N=['Tim','Fleur']; const st={Tim:0,Fleur:0}; let sv=pick(N);
  if(sys===21){st.Tim=Math.floor(rnd(17,19.99));st.Fleur=st.Tim+pick([-2,-1,0,1]);}else{st.Tim=Math.floor(rnd(11,13.99));st.Fleur=st.Tim+pick([-1,0,1]);}
  const qs=[]; const other=p=>N[1-N.indexOf(p)];
  const FAULTS=[p=>`${p} slaat de shuttle in het net.`,p=>`${p} slaat de shuttle achter de achterste lijn, uit.`,p=>`${p} raakt met het racket het net.`,p=>`De shuttle raakt het lichaam van ${p}.`];
  const WINS=[p=>`${p} slaat de shuttle binnen de lijnen op de grond bij ${other(p)}.`,p=>`${p} wint de rally met een smash.`];
  for(let i=0;i<20&&!over(st.Tim,st.Fleur,sys);i++){
    const r=Math.random(); let ev,win=null;
    if(r<.08){ev='Er rolt een shuttle van de buurbaan op de baan.';}
    else if(r<.4){const f=pick(N);ev=pick(FAULTS)(f);win=other(f);}
    else {win=pick(N);ev=pick(WINS)(win);}
    const before=Object.assign({},st), svB=sv, ot=other(sv);
    let correct,why;
    const fmt=(p,s)=>`${p} serveert van ${boxWord(par(s[p]))} · ${s[p]} – ${s[other(p)]}`;
    if(!win){correct=`${sv} serveert opnieuw van ${boxWord(par(st[sv]))} · ${st[sv]} – ${st[ot]}`; why='Let: niemand krijgt een punt, en dezelfde speler serveert opnieuw vanuit hetzelfde vak.';}
    else{st[win]++; const done=over(st[win],st[other(win)],sys); sv=win;
      correct=done?`${win} wint de game · ${st[win]} – ${st[other(win)]}`:fmt(win,st);
      why=`${win} wint de rally${win!==svB?' en mag nu serveren':' en serveert opnieuw'}. ${done?'Dat is genoeg voor de game!':`${st[win]} is ${st[win]%2===0?'even: van rechts':'oneven: van links'}.`}`;}
    const dis=[];
    if(win){const lo=other(win);
      dis.push(`${win} serveert van ${boxWord(par(st[win]+1))} · ${st[win]} – ${st[lo]}`);
      dis.push(`${lo} serveert van ${boxWord(par(st[lo]))} · ${st[lo]} – ${st[win]}`);
      dis.push(`${svB} serveert opnieuw van ${boxWord(par(before[svB]))} · ${before[svB]} – ${before[other(svB)]}`);
      dis.push(over(st[win],st[lo],sys)?fmt(win,st):`${win} wint de game · ${st[win]} – ${st[lo]}`);
    } else {
      dis.push(`${svB} serveert van ${boxWord(par(before[svB]))} · ${before[svB]+1} – ${before[ot]}`);
      dis.push(`${ot} serveert van ${boxWord(par(before[ot]+1))} · ${before[ot]+1} – ${before[svB]}`);
      dis.push(`${svB} serveert opnieuw van ${boxWord(par(before[svB]+1))} · ${before[svB]} – ${before[ot]}`);
    }
    const q={t:'mc',sim:true,sys,q:`${sys===15?'Telling tot 15. ':''}${ev} Wat roep jij als scheidsrechter?`,art:{board:[[svB,before[svB],1],[ot,before[ot],0]]},why,pre:'Rally '+(i+1)};
    const ds=[...new Set(dis)].filter(d=>d!==correct).slice(0,3);
    q.opts=[correct].concat(ds); q.a=0;
    qs.push(q);
  }
  return qs;
}

const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))*100)/100;
const par=n=>n%2===0?'R':'L';
const boxWord=b=>b==='R'?'rechts':'links';
function near(x,y,A){const d=.22;return [Math.abs(x-A.x0),Math.abs(x-A.x1),Math.abs(y-A.y0),Math.abs(y-A.y1)].some(v=>v<d)&&x>A.x0-d&&x<A.x1+d&&y>A.y0-d&&y<A.y1+d;}
function withOpts(q,correct,distract){

  q.opts=opts;q.a=opts.indexOf(correct);return q;
}

function prep(q){

  else if(q.t==='inout') prepInout(q);

    q.art={court:{tap:q.dubbel?'dubbel':'enkel',lab:[[W/2,7.05,'jij staat hier, je kijkt naar het net']]}};
    q.why=sc%2===0?`${sc} is even${sc===0?' (0 telt als even)':''}: je serveert van rechts.`:`${sc} is oneven: je serveert van links.`;
  }
  else if(q.t==='tact') prepTact(q);
  else if(q.t==='kanon') prepKanon(q);
  else if(q.t==='score') prepScore(q);

function prepInout(q){
  const A=AREAS[q.mode]; let x,y;
  if(q.fixed){[x,y]=q.fixed;} else {
    if(Math.random()<.35){ const side=pick(['x0','x1','y1','yf']);
      if(side==='x0'){x=A.x0;y=rnd(A.y0+.3,A.y1-.3);} else if(side==='x1'){x=A.x1;y=rnd(A.y0+.3,A.y1-.3);} else if(side==='y1'){y=A.y1;x=rnd(A.x0+.3,A.x1-.3);} else {y=A.y0>0?A.y0:A.y1;x=rnd(A.x0+.3,A.x1-.3);} }
    else { do{x=rnd(-0.45,W+0.45);y=rnd(0.3,L+0.4);}while(near(x,y,A)); }
  }
  const e=1e-6, inn=x>=A.x0-e&&x<=A.x1+e&&y>=A.y0-e&&y<=A.y1+e;
  const online=inn&&(Math.abs(x-A.x0)<e||Math.abs(x-A.x1)<e||Math.abs(y-A.y0)<e||Math.abs(y-A.y1)<e);
  const svc=q.mode.includes('service'), dub=q.mode.startsWith('dubbel');
  q.opts=['In','Uit'];q.a=inn?0:1;q.cols='two';q.land=true;
  if(svc){
    q.q=`Service in ${dub?'dubbelspel':'enkelspel'}. Jij serveert van rechts. Is de service in of uit?`;

    else if(!inn&&!dub&&x<SI&&x>=0&&y>=SS&&y<=L) q.why='In enkelspel telt bij de service de buitenste zijlijn niet mee: uit.';
  } else {

    q.art={court:{full:true,areas:[{x0:A.x0,x1:A.x1,y0:-A.y1,y1:-A.y0}],player:[[rnd(1.2,W-1.2),rnd(2.6,5.4),'#2b3bd8','jij']],dot:[x,-y]}};
    q.why=online?'Het dopje landt precies op de lijn. De lijn hoort bij het vak, dus: in!':inn?'De shuttle valt binnen het oranje vak: in!':'De shuttle valt buiten het oranje vak: uit.';

function prepTact(q){

  q.check=(mx,my)=>{
    const inside=mx>=SI-.1&&mx<=W-SI+.1&&my>=-L-.1&&my<0; const d=Math.hypot(mx-ox,my-oy);

}
function prepKanon(q){

  q.art={court:{full:true,lab:[[W/2,7.05,'jij staat aan deze kant']]}};
  q.target=T; q.from=[box==='R'?(dub?4.6:4.3):(dub?1.5:1.8),4.2]; q.art.court.player=[[q.from[0],q.from[1],'#2b3bd8','jij']];
  q.check=(mx,my)=>{
    const t=.12, inT=mx>=T.x0-t&&mx<=T.x1+t&&my>=T.y0-t&&my<=T.y1+t;
    const why0=`${sc} is ${sc%2===0?'even':'oneven'}, dus je serveert van ${boxWord(box)}. De service gaat schuin over het net naar het vak ${box==='R'?'links':'rechts'} aan de overkant${dub?', breed en kort in dubbel':', smal en lang in enkel'}.`;
    if(inT) return [true,why0];
    if(my>=0) return [false,'Je service moet over het net, naar de overkant. '+why0];
    if(my>-SS&&mx>=T.x0&&mx<=T.x1) return [false,'Te kort: niet voorbij de voorste serveerlijn. '+why0];
    if(dub&&my<-LD&&mx>=T.x0&&mx<=T.x1) return [false,'Te lang: in dubbel is de achterste serveerlijn de grens. '+why0];
    if(!dub&&(mx<SI||mx>W-SI)&&my<=-SS) return [false,'Te breed: in enkel telt de buitenste zijlijn niet. '+why0];
    return [false,'Verkeerd vak. '+why0];

}
function over(a,b,sys){const m=Math.max(a,b),d=Math.abs(a-b);if(sys===11)return m>=11;if(sys===15)return (m>=15&&d>=2)||m>=21;return (m>=21&&d>=2)||m>=30;}
function prepScore(q){
  const sys=q.sys, N=['Tim','Fleur'];
  let a,b,tries=0;
  do{
    tries++;
    if(sys===11){a=Math.floor(Math.random()*11);b=Math.floor(Math.random()*11);if(Math.random()<.4)a=10;}
    else{const top=sys===15?[13,20]:[19,29];if(Math.random()<.6){a=Math.floor(rnd(top[0],top[1]));b=a+pick([-2,-1,0,0,1]);}else{a=Math.floor(Math.random()*sys);b=Math.floor(Math.random()*sys);}}
    if(b<0)b=0;
  }while((over(a,b,sys)||(sys===11&&(a>10||b>10)))&&tries<200);
  const sv=pick(N), ot=N[1-N.indexOf(sv)]; const sc={}; sc[sv]=a; sc[ot]=b;
  const win=pick(N), lo=N[1-N.indexOf(win)]; const ns=Object.assign({},sc); ns[win]++;
  const done=over(ns[win],ns[lo],sys);
  const fmt=(p,o,s)=>`${p} serveert van ${boxWord(par(s[p]))} · ${s[p]} – ${s[o]}`;
  const correct=done?`${win} wint de game · ${ns[win]} – ${ns[lo]}`:fmt(win,lo,ns);
  const dis=[];
  const flip=Object.assign({},ns); dis.push(`${win} serveert van ${boxWord(par(ns[win]+1))} · ${ns[win]} – ${ns[lo]}`);
  dis.push(`${lo} serveert van ${boxWord(par(ns[lo]))} · ${ns[lo]} – ${ns[win]}`);
  if(ns[win]!==ns[lo]) dis.push(`${win} serveert van ${boxWord(par(ns[win]))} · ${ns[lo]} – ${ns[win]}`);
  dis.push(`${sv} serveert van ${boxWord(par(sc[sv]))} · ${sc[sv]} – ${sc[ot]}`);
  if(done) dis.push(fmt(win,lo,ns)); else dis.push(`${win} wint de game · ${ns[win]} – ${ns[lo]}`);
  q.q=`${sys===11?'We spelen tot 11.':sys===15?'Telling tot 15.':'Telling tot 21.'} ${sv} serveert, het staat <strong>${a} – ${b}</strong>. <strong>${win}</strong> wint de rally. Wat roept de scheidsrechter nu?`;
  q.art={board:[[sv,sc[sv],1],[ot,sc[ot],0]]};
  withOpts(q,correct,dis);
  let why=`${win} wint de rally en krijgt een punt: ${ns[win]}. `;
  if(done){ why+= sys===11?'11 punten: game gewonnen!': (Math.max(ns[win],ns[lo])===(sys===15?21:30)?`${ns[win]} is het maximum: wie dat punt pakt, wint de game.`:`${ns[win]} punten en 2 punten voorsprong: game gewonnen!`); }
  else {
    why+= win===sv?`${win} serveerde al en serveert opnieuw. `:`${win} wint de rally, dus ${win} mag nu serveren. `;
    why+=`${ns[win]} is ${ns[win]%2===0?'even: van rechts':'oneven: van links'}. De serveerder noemt eerst zijn eigen punten.`;
    if(sys!==11&&Math.max(ns[win],ns[lo])>=sys&&Math.abs(ns[win]-ns[lo])<2) why+=' Nog geen 2 punten voorsprong, dus de game gaat door.';
    if((sys===15&&ns[win]===20&&ns[lo]===20)||(sys===21&&ns[win]===29&&ns[lo]===29)) why+=' Het volgende punt beslist de game!';
  }
  q.why=why;
}
function prepDub(q){
  const WIJ=['Sam','Noor'], ZIJ=['Mo','Lisa'];
  const sc={W:Math.floor(Math.random()*12),Z:Math.floor(Math.random()*12)};
  const srv=pick(['W','Z']);
  const pos={W:{},Z:{}}; const w=shuffle(WIJ), z=shuffle(ZIJ); pos.W.R=w[0];pos.W.L=w[1];pos.Z.R=z[0];pos.Z.L=z[1];
  const server=pos[srv][par(sc[srv])];
  const coords={W:{R:[4.6,4.2],L:[1.5,4.2]},Z:{R:[1.5,-4.2],L:[4.6,-4.2]}};
  const players=[];['W','Z'].forEach(t=>['R','L'].forEach(b=>{const nm=pos[t][b];players.push([coords[t][b][0],coords[t][b][1],t==='W'?'#2b3bd8':'#f07f1a',nm,nm===server?1:0]);}));
  const win=pick(['W','Z']); const tn=t=>t==='W'?'Wij':'Zij';
  const ns={W:sc.W,Z:sc.Z}; ns[win]++;
  let nServer,nBox,why;
  if(win===srv){ nServer=server; nBox=par(ns[win]);
    why=`${tn(win)} wonnen de rally tijdens ${win==='W'?'onze':'hun'} eigen service. Dan wisselt ${server} van vak met de partner en serveert opnieuw. ${ns[win]} is ${ns[win]%2===0?'even':'oneven'}: ${server} serveert nu van ${boxWord(nBox)}.`; }
  else { nBox=par(ns[win]); nServer=pos[win][nBox];
    why=`${tn(win)} wonnen de rally terwijl ${win==='W'?'wij':'zij'} ontvingen. Nu gaan ${win==='W'?'wij':'zij'} serveren, en niemand wisselt van vak. ${tn(win)} hebben ${ns[win]} ${ns[win]===1?'punt':'punten'} (${ns[win]%2===0?'even':'oneven'}), dus serveert wie ${boxWord(nBox)} staat: ${nServer}.`; }
  const correct=`${nServer}, van ${boxWord(nBox)}`;
  const all=[];WIJ.concat(ZIJ).forEach(n=>['R','L'].forEach(b=>all.push(`${n}, van ${boxWord(b)}`)));
  const pri=[`${nServer}, van ${boxWord(nBox==='R'?'L':'R')}`,`${server}, van ${boxWord(par(sc[srv]))}`];
  const other=pos[win][nBox==='R'?'L':'R']; pri.push(`${other}, van ${boxWord(nBox)}`);
  q.q=`Dubbelspel. Wij (blauw) <strong>${sc.W}</strong>, zij (oranje) <strong>${sc.Z}</strong>. ${server} serveert. <strong>${tn(win)}</strong> winnen de rally. Wie serveert nu, en van welk vak (vanuit zichzelf gezien)?`;
  q.art={court:{full:true,player:players,lab:[[W/2,6.95,'wij · '+sc.W],[W/2,-6.95,'zij · '+sc.Z]]}};
  const ds=shuffle(pri).concat(shuffle(all));
  withOpts(q,correct,ds.filter(d=>d!==correct).slice(0,6));
  q.why=why;
}

function opfrisNeeded(n){const p=P();return n>1&&!!p.passed[n-1]&&!p.opfris[n];}
function levelOpen(n){const p=P();return n===1||!!p.passed[n-1]||p.unlock>=n;}
function lessonOpen(l,i){return i===0?!opfrisNeeded(l.n):!!P().lessons[l.lessons[i-1].id];}
function lessonsDone(l){return l.lessons.filter(x=>P().lessons[x.id]).length;}
function examOpen(l){return lessonsDone(l)===l.lessons.length;}
function topicStars(t){const p=P();return LEVELS.filter(l=>{const ls=l.lessons.filter(x=>x.topic===t);return ls.length&&ls.every(x=>p.lessons[x.id]);}).length;}
function nextStep(){
  for(const l of LEVELS){ if(!levelOpen(l.n)) return null; if(P().passed[l.n]) continue;
    if(opfrisNeeded(l.n)) return {kind:'opfris',n:l.n,label:`Opfrissen voor niveau ${l.n}`};
    const i=l.lessons.findIndex(x=>!P().lessons[x.id]);
    if(i>=0) return {kind:'lesson',n:l.n,li:i,label:`Niveau ${l.n} · ${l.lessons[i].title}`};
    return {kind:'exam',n:l.n,label:`Eindtoets niveau ${l.n}`};
  }
  return null;
}
function doStep(s){
  if(s.kind==='opfris') startQuiz({n:s.n,title:`Opfrissen niveau ${s.n}`,kind:'opfris',src:()=>opfrisFor(s.n)});
  else if(s.kind==='lesson') go({view:'lesson',n:s.n,li:s.li,i:0});
  else startQuiz({n:s.n,title:`Eindtoets niveau ${s.n}`,kind:'exam',src:()=>examFor(s.n)});
}
/* Foutenbak: foute vragen komen later terug, tot ze twee keer goed zijn */
const H20=20*3600e3, H44=44*3600e3;
function bakKey(raw){const r=Object.assign({},raw);delete r.timer;return JSON.stringify(r);}
function bakAdd(raw){const p=P();const k=bakKey(raw);const it=p.bak.find(b=>b.k===k);
  if(it){it.ok=0;it.due=Date.now()+H20;} else {const r=Object.assign({},raw);delete r.timer;p.bak.push({k,r,ok:0,due:Date.now()+H20});} if(p.bak.length>60)p.bak.shift();}
function bakDue(){return P().bak.filter(b=>b.due<=Date.now());}

function landAnim(done){
  done=done||function(){};
  const gs=document.querySelectorAll('#art .landing'); if(!gs.length){done();return;}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){done();return;}
  let left=gs.length;
  gs.forEach(g=>{
    const sh=g.querySelector('.shut'), tr=g.querySelector('.trail'), mk=g.querySelectorAll('.mark');
    const tx=+g.dataset.tx,ty=+g.dataset.ty,sx=+g.dataset.sx,sy=+g.dataset.sy,a=+g.dataset.a,k0=+g.dataset.k;
    const dist=Math.hypot(tx-sx,ty-sy), D=Math.max(700,Math.min(1400,dist*3.2)), t0=performance.now();
    mk.forEach(m=>m.style.opacity=0);
    (function step(t){const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,2), lift=Math.sin(Math.PI*k);
      const x=sx+(tx-sx)*e, y=sy+(ty-sy)*e-lift*Math.min(40,dist*.18);
      sh.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${(k0*(1+lift*.7)).toFixed(2)}) translate(-16 -26)`);
      tr.setAttribute('x2',x.toFixed(1)); tr.setAttribute('y2',(sy+(ty-sy)*e).toFixed(1));
      if(k<1) requestAnimationFrame(step); else {mk.forEach(m=>m.style.opacity=1); if(--left===0) done();}
    })(t0);
  });
}
function startTimer(sec){
  stopTimer(); const bar=document.getElementById('tbar'); const t0=Date.now();

}
function answer(i,el){
  const c=cur, q=c.qs[c.k]; if(c.answered!=null) return;

  else {c.streak=0;c.missed.push({q:questionText(q).replace(/<[^>]+>/g,''),a:q.tap?'':q.opts[q.a],why:q.tap?q.result[1]:q.why});}
  if(q.raw&&!q.sim){
    if(c.kind==='bak'){const p=P(),k=bakKey(q.raw),it=p.bak.find(b=>b.k===k);
      if(it){ if(ok){it.ok++;it.due=Date.now()+H44; if(it.ok>=2) p.bak=p.bak.filter(b=>b!==it);} else {it.ok=0;it.due=Date.now()+H20;} }}

/* Bestand bewaren: in Claude via de downloads-functie, daarbuiten met een gewone download */
async function getSaver(){
  let dl=null; try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);}catch(e){}
  if(dl) return (name,blob)=>dl.save({filename:name,data:blob});
  if(window.claude) return null;
  return (name,blob)=>new Promise(res=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();res();},500);});
}

    :`<div class="warn">Geen Nederlandse stem gevonden. iPad/iPhone: Instellingen › Toegankelijkheid › Gesproken materiaal › Stemmen › Nederlands › Claire. Windows: Instellingen › Tijd en taal › Spraak › stem toevoegen › Nederlands.</div><div><button class="btn alt small" id="rescan">Opnieuw zoeken</button></div>`)+`
    <p class="note">Dit apparaat geeft ${allVoices.length} ${allVoices.length===1?'stem':'stemmen'} door aan de app, waarvan ${voices.length} Nederlands. Siri-stemmen geeft Apple niet door aan websites.</p>
    <label class="row note"><input type="checkbox" id="allv" ${S.allv?'checked':''}> Toon ook stemmen in andere talen <span class="muted">(die lezen Nederlands met een accent)</span></label>
    <label for="rt" class="note">Snelheid: <span id="rtv">${S.rate.toFixed(2)}</span></label>
    <input type="range" id="rt" min="0.6" max="1.2" step="0.05" value="${S.rate}">
    <label class="row note"><input type="checkbox" id="au" ${S.auto?'checked':''}> Automatisch voorlezen</label>
    <label class="row note"><input type="checkbox" id="bg" ${S.big?'checked':''}> Grotere letters</label>`;
  if(tab==='ouders') body=`
    <h3>Voor ouders</h3>
    <p class="small">Shuttle-school leert de spelregels van badminton, stap voor stap, in 5 niveaus. Op elk niveau komen dezelfde 8 onderwerpen terug, steeds een beetje dieper.</p>
    <p class="small"><b>Foutloos = verder.</b> Een les gaat pas open als de toets van de vorige les helemaal goed is. Zo blijft niets half hangen. Fout? Dan ziet je kind wat er misging en probeert het opnieuw.</p>
    <p class="small"><b>Hulp:</b> alles wordt voorgelezen, en het gloeilampje geeft een hint zonder het antwoord te verklappen. Foute vragen komen later terug in de foutenbak.</p>
    <p class="small"><b>Gegevens:</b> voortgang en shuttles staan alleen op dit apparaat, per voornaam. Er gaat niets naar de club of naar internet.</p>`;
  if(tab==='trainer'){
    if(!trainerOk) body=`<form class="row" id="tf"><label for="tc" class="note">Trainerscode</label><input type="password" id="tc" autocomplete="off" style="width:150px"><button class="btn alt small" type="submit">Open</button></form><p class="note" id="tmsg" role="status"></p>`;
    else body=`
    <div class="row"><label for="tl" class="note">${esc(S.current)} mag spelen t/m</label><select id="tl">${[1,2,3,4,5].map(n=>`<option value="${n}" ${p.unlock===n?'selected':''}>Niveau ${n}</option>`).join('')}</select></div>
    <div class="tbl" role="table" aria-label="Voortgang per speler"><div class="tr th" role="row"><span>Speler</span><span>Gehaald</span><span>Nu bezig</span><span>Foutenbak</span></div>
      ${Object.keys(S.profiles).map(nm=>{const q=S.profiles[nm]; const hi=[1,2,3,4,5].filter(n=>q.passed&&q.passed[n]).pop()||0; const curL=LEVELS[Math.min(hi,4)]; const d=curL.lessons.filter(x=>q.lessons&&q.lessons[x.id]).length;
        return `<div class="tr" role="row"><span>${esc(nm)}</span><span>${hi?'niveau '+hi:'–'}</span><span>${hi>=5?'klaar':`N${curL.n}: ${d}/${curL.lessons.length}`}</span><span>${(q.bak||[]).length}</span></div>`;}).join('')}</div>
    <h3>QR-code voor een hulpkaart</h3>
    <label for="al" class="note">Link van de app (het webadres waar de app staat)</label><input type="text" id="al" value="${esc(S.applink||'')}" placeholder="https://claude.ai/…">
    <div class="row"><select id="ql" aria-label="Kies een les">${LEVELS.map(l=>`<optgroup label="Niveau ${l.n}">${l.lessons.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</optgroup>`).join('')}</select><button class="btn alt small" id="mkqr">Maak QR</button></div>
    <div class="row" style="align-items:flex-start"><div id="qr" class="qrbox"></div><div class="stack" style="min-width:0;flex:1"><p class="note" id="qrt"></p><button class="btn alt small" id="saveqr" hidden>Bewaar QR</button></div></div>`;
  }
  app.innerHTML=`
  <div class="topline"><button class="back" id="bk">${I.back} Terug</button><span class="label">Instellingen</span></div>
  <div class="tabs" role="tablist">${[['spelers','Spelers'],['stem','Stem & tekst'],['ouders','Ouders'],['trainer','Trainer']].map(([k,t])=>`<button role="tab" class="tab ${tab===k?'on':''}" data-tab="${k}" aria-selected="${tab===k}">${t}</button>`).join('')}</div>
  <div class="card stack">${body}</div>`;
  document.getElementById('bk').onclick=()=>go({view:'home'});
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{cur.tab=b.dataset.tab;render();});
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.current=b.dataset.p;save();render();});
  const pf=document.getElementById('pf'); if(pf) pf.onsubmit=e=>{e.preventDefault();const nm=document.getElementById('pn').value.trim();if(!nm)return;S.profiles[nm]=S.profiles[nm]||newProfile();S.current=nm;save();render();};
  const vs=document.getElementById('vs'); if(vs) vs.onchange=()=>{S.voice=opts[+vs.value].name;save();speak('Hoi! Zal ik jou de spelregels van badminton uitleggen?',null,opts[+vs.value]);};
  const hb=document.getElementById('hear'); if(hb) hb.onclick=()=>speak('Hoi! Zal ik jou de spelregels van badminton uitleggen? De lijn is in!',hb,opts[+vs.value]);
  const rs=document.getElementById('rescan'); if(rs) rs.onclick=()=>{if(synth){try{synth.cancel();speak(' ');synth.getVoices();}catch(e){}} setTimeout(render,600); setTimeout(render,1800);};
  const rt=document.getElementById('rt'); if(rt) rt.oninput=()=>{S.rate=+rt.value;document.getElementById('rtv').textContent=S.rate.toFixed(2);save();};
  const au=document.getElementById('au'); if(au) au.onchange=e=>{S.auto=e.target.checked;save();};
  const av=document.getElementById('allv'); if(av) av.onchange=e=>{S.allv=e.target.checked;save();render();};
  const bg=document.getElementById('bg'); if(bg) bg.onchange=e=>{S.big=e.target.checked;save();render();};
  const tf=document.getElementById('tf'); if(tf) tf.onsubmit=e=>{e.preventDefault();
    if(document.getElementById('tc').value.trim().toLowerCase()!==TRAINER_CODE){document.getElementById('tmsg').textContent='Die code klopt niet.';return;} trainerOk=true;render();};
  const tl=document.getElementById('tl'); if(tl) tl.onchange=()=>{P().unlock=+tl.value;save();};
  const al=document.getElementById('al'); if(al) al.onchange=()=>{S.applink=al.value.trim();save();};
  const mk=document.getElementById('mkqr'); if(mk) mk.onclick=()=>{
    S.applink=document.getElementById('al').value.trim();save();
    const box=document.getElementById('qr'), t=document.getElementById('qrt'); box.innerHTML='';
    if(!/^https:\/\//.test(S.applink)){t.textContent='Plak eerst de link van de app. Die vind je via Delen, rechtsboven in Claude.';return;}
    const link=S.applink.replace(/#.*$/,'')+'#les-'+document.getElementById('ql').value;
    if(typeof QRCode==='undefined'){t.textContent='De QR-maker kon niet laden. Probeer het later opnieuw.';return;}
    new QRCode(box,{text:link,width:170,height:170,correctLevel:QRCode.CorrectLevel.M});
    t.textContent=link; qrSaveBtn();
  };
}
async function qrSaveBtn(){
  const sv=await getSaver();
  const b=document.getElementById('saveqr'); if(!b||!sv) return; b.hidden=false;
  b.onclick=async()=>{const cv=document.querySelector('#qr canvas'); if(!cv) return;
    cv.toBlob(async bl=>{try{await sv('shuttle-school-qr-'+document.getElementById('ql').value+'.png',bl);}catch(e){}},'image/png');};
}

const SPLASH_TXT='Welkom bij Shuttle-school van Luck Raeck. Hier leer je spelenderwijs de spelregels van badminton. Je gaat langs vijf niveaus. Op elk niveau komen dezelfde acht onderwerpen terug, steeds een stukje moeilijker. Maak elke toets foutloos, dan gaat de volgende stap open. En met elk goed antwoord spaar je shuttles.';
function splashView(){
  app.innerHTML=`
  <div class="splash">
    <div class="logo"><img src="${LOGO}" alt="Luck Raeck, badmintonvereniging Montfoort"></div>
    <div class="spmid">
      <h1>Shuttle-school</h1>
      <p class="spsub">Leer de spelregels van badminton, stap voor stap.</p>
      <ol class="spsteps">
        <li><span>1</span>Luister naar de uitleg</li>
        <li><span>2</span>Maak de toets foutloos</li>
        <li><span>3</span>Spaar shuttles en haal je diploma</li>
      </ol>
      <p class="note">5 niveaus · 8 onderwerpen · elk niveau een stapje dieper</p>
    </div>
    <div class="spbot">
      <button class="bigbtn start" id="start"><span class="bb1">Start</span>${I.play}</button>
      <button class="linkbtn" id="splay">${I.speaker} Lees voor</button>
    </div>
  </div>`;
  document.getElementById('start').onclick=()=>{hush(); if(!openFromHash()) go({view:'home'});};
  const sb=document.getElementById('splay'); sb.onclick=()=>speak(SPLASH_TXT,sb);
}
/* ---------- Directe link naar een les (QR op de hulpkaart) ---------- */
function openFromHash(){
  const m=/^#les-([a-z0-9-]+)$/.exec(location.hash||''); if(!m) return false;
  for(const l of LEVELS){const i=l.lessons.findIndex(x=>x.id===m[1]); if(i>=0){go({view:'lesson',n:l.n,li:i,i:0});return true;}}
  return false;
}
window.addEventListener('hashchange',openFromHash);

P(); cur={view:'splash'}; render();
</script>
